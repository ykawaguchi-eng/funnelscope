function bindDetailEvents(f){
  const pane=document.getElementById("paneDetail");
  if(!pane) return;
  const stepOf = el => f.steps.find(x=>x.id===el.closest(".dt-row").dataset.sid);
  const toggleRow = row=>{
    const id=row.dataset.sid;
    if(detailExpanded.has(id)) detailExpanded.delete(id); else detailExpanded.add(id);
    row.classList.toggle("open", detailExpanded.has(id));
  };
  /* 行の余白クリックで展開（入力欄・ボタンのクリックは除外） */
  pane.querySelectorAll(".dt-main").forEach(main=>{
    main.onclick=e=>{ if(e.target.closest("input,textarea,button")) return; toggleRow(main.closest(".dt-row")); };
  });
  pane.querySelectorAll(".dt-toggle").forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); toggleRow(btn.closest(".dt-row")); };
  });
  /* 段階名・通過人数（再描画せずフォーカス保持。表示はupdateDetailRatesで即時更新） */
  pane.querySelectorAll(".dt-name-in,.dt-count-in").forEach(inp=>{
    inp.onclick=e=>e.stopPropagation();
    inp.oninput=()=>{
      const s=stepOf(inp); if(!s) return;
      if(inp.dataset.k==="name") s.name=inp.value;
      else setStepCount(s, activePeriod, inp.value);
      saveSoon(); renderSidebar(); updateDetailRates();
    };
  });
  /* 補助指標の編集 */
  pane.querySelectorAll(".dm-in").forEach(inp=>{
    inp.oninput=()=>{
      const s=stepOf(inp); if(!s) return;
      const mt=(s.metrics||[]).find(x=>x.id===inp.dataset.mid); if(!mt) return;
      mt[inp.dataset.k]=inp.value; saveSoon();
    };
  });
  /* 日別の編集 */
  pane.querySelectorAll(".dd-date,.dd-val").forEach(inp=>{
    inp.oninput=()=>{
      const s=stepOf(inp); if(!s) return;
      const dy=(s.daily||[]).find(x=>x.id===inp.dataset.did); if(!dy) return;
      dy[inp.dataset.k] = inp.dataset.k==="value" ? (inp.value===""?"":Math.max(0,Number(inp.value))) : inp.value;
      saveSoon();
    };
  });
  /* メモ */
  pane.querySelectorAll(".dmemo-in").forEach(t=>{
    t.oninput=()=>{ const s=stepOf(t); if(s){ s.memo=t.value; saveSoon(); } };
  });
  /* 指標を追加（追加後も行は開いたまま維持） */
  pane.querySelectorAll(".add-metric").forEach(b=>{
    b.onclick=()=>{
      const s=f.steps.find(x=>x.id===b.closest(".dt-row").dataset.sid); if(!s) return;
      s.metrics=s.metrics||[]; const nm={id:uid("m"),label:"",value:"",unit:""};
      s.metrics.push(nm); detailExpanded.add(s.id); saveSoon(); renderDetail();
      const el=document.querySelector(`.dmetric[data-mid="${nm.id}"] .dm-in.label`); if(el) el.focus();
    };
  });
  /* 日付を追加 */
  pane.querySelectorAll(".add-daily").forEach(b=>{
    b.onclick=()=>{
      const s=f.steps.find(x=>x.id===b.closest(".dt-row").dataset.sid); if(!s) return;
      s.daily=s.daily||[]; const nd={id:uid("d"),date:"",value:""};
      s.daily.push(nd); detailExpanded.add(s.id); saveSoon(); renderDetail();
      const el=document.querySelector(`.ddaily[data-did="${nd.id}"] .dd-date`); if(el) el.focus();
    };
  });
  /* 指標を削除 */
  pane.querySelectorAll(".dm-del").forEach(b=>{
    b.onclick=()=>{
      const s=f.steps.find(x=>x.id===b.closest(".dt-row").dataset.sid); if(!s) return;
      s.metrics=(s.metrics||[]).filter(x=>x.id!==b.dataset.mid); detailExpanded.add(s.id); saveSoon(); renderDetail();
    };
  });
  /* 日別を削除 */
  pane.querySelectorAll(".dd-del").forEach(b=>{
    b.onclick=()=>{
      const s=f.steps.find(x=>x.id===b.closest(".dt-row").dataset.sid); if(!s) return;
      s.daily=(s.daily||[]).filter(x=>x.id!==b.dataset.did); detailExpanded.add(s.id); saveSoon(); renderDetail();
    };
  });
  /* 電話予約 */
  const pin=document.getElementById("phoneCountIn");
  if(pin) pin.oninput=()=>{ f.phone.count=pin.value===""?"":Math.max(0,Number(pin.value)); saveSoon(); updatePhoneStats(); };
  const pnote=document.getElementById("phoneNoteIn");
  if(pnote) pnote.oninput=()=>{ f.phone.note=pnote.value; saveSoon(); };
}

/* 通過人数の変更を、表内の棒・遷移率・到達率・ボトルネックへ即時反映（全再描画せずフォーカス保持） */
function updateDetailRates(){
  const f=activeFunnel(); if(!f) return;
  const pane=document.getElementById("paneDetail"); if(!pane) return;
  const m=computeMetrics(f);
  pane.querySelectorAll(".dt-row").forEach((row,i)=>{
    const ms=m.steps[i]; if(!ms) return;
    const isBn=(i===m.bottleneck);
    row.classList.toggle("bn", isBn);
    const bar=row.querySelector(".dt-bar"); if(bar) bar.style.width=Math.max(2,ms.count/m.maxCount*100).toFixed(1)+"%";
    const rate=row.querySelector(".dt-rate");
    if(rate){
      if(i===0){ rate.className="dt-rate none"; rate.innerHTML='—<span class="sub">起点</span>'; }
      else if(ms.rate===null){ rate.className="dt-rate none"; rate.innerHTML='—'; }
      else{ const gain=ms.lost<0; const sub=ms.lost>0?`${fmt(ms.lost)}人 離脱`:(gain?`${fmt(-ms.lost)}人 増加`:'増減なし');
        rate.className="dt-rate "+(isBn?'bn':(gain?'gain':'')); rate.innerHTML=`${pct(ms.rate)}<span class="sub">${sub}</span>`; }
    }
    const reach=row.querySelector(".dt-reach");
    if(reach){ const rv=(m.first>0)?ms.count/m.first*100:null; reach.className="dt-reach "+(rv===null?'dim':''); reach.textContent=rv===null?'—':pct(rv); }
  });
  updatePhoneStats();
}

function updatePhoneStats(){
  const f=activeFunnel(); if(!f) return;
  const m=computeMetrics(f,"total"), pc=num(f.phone.count);   /* 電話予約は全期間合計に対する比率 */
  const rAll=m.first>0?pc/m.first*100:null, rLast=m.last>0?pc/m.last*100:null;
  const e1=document.getElementById("phoneStatAll"), e2=document.getElementById("phoneStatLast");
  if(e1){ e1.textContent=rAll===null?'—':pct(rAll); e1.classList.toggle("dim",rAll===null); }
  if(e2){ e2.textContent=rLast===null?'—':pct(rLast); e2.classList.toggle("dim",rLast===null); }
}

/* Enter／矢印上下で上下のセルへ移動（Tab は標準動作で右へ） */
function handleMatrixNav(e,inp){
  if(e.key!=="Enter"&&e.key!=="ArrowDown"&&e.key!=="ArrowUp") return;
  const td=inp.closest('td'), tr=inp.closest('tr');
  const cellIdx=[...tr.children].indexOf(td);
  const target=(e.key==="ArrowUp")?tr.previousElementSibling:tr.nextElementSibling;
  if(!target) return;
  const next=target.children[cellIdx] && target.children[cellIdx].querySelector('input');
  if(next){ e.preventDefault(); next.focus(); next.select(); }
}

/* ================= COMPARE（日別比較） ================= */
function renderCompare(){
  const f=activeFunnel(); const pane=document.getElementById("paneCompare");
  if(!f||!pane) return;
  const dates=(f.dates||[]);
  if(dates.length===0){
    pane.innerHTML=`<div class="cmp-empty"><div class="cmp-empty-t">日別データがまだありません</div>
      <div class="cmp-empty-s">「ファネル図」タブのステップ入力で日付ごとの人数を入れると、<br>ここで日別の通過人数・遷移率を並べて比較できます。</div></div>`;
    return;
  }
  const days=dates.map(d=>({d, m:computeMetrics(f,d)}));
  const totalM=computeMetrics(f,"total");

  /* 1) 全体CVRの推移 */
  const cvrs=days.map(x=>x.m.overall);
  const valid=cvrs.filter(v=>v!==null);
  let best=-1,worst=-1,bestV=-Infinity,worstV=Infinity;
  cvrs.forEach((v,i)=>{ if(v!==null){ if(v>bestV){bestV=v;best=i;} if(v<worstV){worstV=v;worst=i;} } });
  let spark="";
  if(valid.length>=1){
    const mn=Math.min(...valid), mx=Math.max(...valid), rng=(mx-mn)||1;
    const W=640,H=104,n=cvrs.length;
    const pts=cvrs.map((v,i)=>{ const x=n===1?W/2:i/(n-1)*(W-48)+24; const y=v===null?H-20:H-20-((v-mn)/rng)*(H-44); return [x,y,v]; });
    const line=pts.filter(p=>p[2]!==null).map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const dots=pts.map((p,i)=>p[2]===null?'':`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${i===best?'#1f9d57':(i===worst?'#d23f30':'#0f7a64')}"/><text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#17181b">${pct(p[2])}</text>`).join('');
    const labels=pts.map((p,i)=>`<text x="${p[0].toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="10" font-weight="700" fill="#94959c">${esc(dates[i])}</text>`).join('');
    spark=`<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block">
      <path d="${line}" fill="none" stroke="#0f7a64" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>`;
  }

  /* 2) 段階別 通過人数 + 段階間 遷移率を交互に並べた一望テーブル */
  let rows="";
  totalM.steps.forEach((s,i)=>{
    /* 段階行：その段階の通過人数（日別 + 合計） */
    const counts=days.map(x=>x.m.steps[i]?x.m.steps[i].count:0);
    const valid=counts.filter((c,idx)=>{ const v=days[idx].m.steps[i]; return v && (v.count>0 || (v.count===0 && days[idx].m.steps.some(z=>z.count>0))); });
    let bestC=-1, worstC=-1, bestCV=-Infinity, worstCV=Infinity;
    counts.forEach((c,idx)=>{ const cell=days[idx].m.steps[i]; const hasData=!!cell && (cell.count>0); if(hasData){ if(c>bestCV){bestCV=c;bestC=idx;} if(c<worstCV){worstCV=c;worstC=idx;} } });
    const cnumCells=counts.map((c,idx)=>{
      const cell=days[idx].m.steps[i]; const hasData=!!cell && (cell.count>0);
      let cls="";
      if(hasData && bestC!==worstC){ if(idx===bestC) cls="cmp-best"; else if(idx===worstC) cls="cmp-worst"; }
      return `<td class="cmp-cell cmp-numcell ${cls}">${hasData?fmt(c):'<span class="cmp-dim">—</span>'}</td>`;
    }).join("");
    const tcount=totalM.steps[i].count;
    rows+=`<tr class="cmp-stage-row">
      <td class="cmp-rowlabel cmp-stage"><span class="cmp-stagenum">${i+1}</span>${esc(s.name)||'<span class="cmp-dim">（無名）</span>'}</td>
      ${cnumCells}
      <td class="cmp-cell cmp-numcell cmp-total">${fmt(tcount)}</td>
    </tr>`;

    /* 遷移行（最後の段階の下には不要） */
    if(i<totalM.steps.length-1){
      const next=totalM.steps[i+1];
      const rates=days.map(x=>x.m.steps[i+1]?x.m.steps[i+1].rate:null);
      const lostByDay=days.map(x=>x.m.steps[i+1]?x.m.steps[i+1].lost:null);
      const v=rates.filter(r=>r!==null);
      const rmax=v.length?Math.max(...v):null, rmin=v.length?Math.min(...v):null;
      const rcells=rates.map((r,idx)=>{
        let cls="";
        if(r!==null && rmax!==rmin){ if(r===rmax)cls="cmp-best"; else if(r===rmin)cls="cmp-worst"; }
        const lost=lostByDay[idx];
        const sub=(lost==null)?'':(lost>0?`<span class="cmp-sub">−${fmt(lost)}人</span>`:(lost<0?`<span class="cmp-sub up">+${fmt(-lost)}人</span>`:''));
        return `<td class="cmp-cell cmp-ratecell ${cls}">${r===null?'<span class="cmp-dim">—</span>':pct(r)}${sub}</td>`;
      }).join("");
      const tr=next.rate, tlost=next.lost;
      const tsub=(tlost==null)?'':(tlost>0?`<span class="cmp-sub">−${fmt(tlost)}人</span>`:(tlost<0?`<span class="cmp-sub up">+${fmt(-tlost)}人</span>`:''));
      rows+=`<tr class="cmp-trans-row">
        <td class="cmp-rowlabel cmp-trans"><span class="cmp-transarrow">↓</span>${esc(s.name)||'前'} → ${esc(next.name)||'次'} の遷移率</td>
        ${rcells}
        <td class="cmp-cell cmp-ratecell cmp-total">${tr===null?'—':pct(tr)}${tsub}</td>
      </tr>`;
    }
  });
  const dayHead=days.map(x=>`<th>${esc(x.d)}</th>`).join("");

  pane.innerHTML=`
    <div class="cmp-intro"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg>
      日ごとの成果を並べて比較します。各段階の通過人数（濃いグレー行）と、その下の遷移率（薄い行）を交互に表示しています。緑＝最も良かった日、赤＝最も悪かった日です。</div>
    <div class="cmp-card">
      <div class="cmp-title">全体コンバージョン率の推移</div>
      ${spark||'<div class="cmp-empty-s">表示できるデータがありません</div>'}
      ${best>=0?`<div class="cmp-note">最も高い日：<b class="up">${esc(dates[best])}（${pct(bestV)}）</b>　／　最も低い日：<b class="down">${esc(dates[worst])}（${pct(worstV)}）</b></div>`:''}
    </div>
    <div class="cmp-card">
      <div class="cmp-title">段階ごとの通過人数と遷移率（日別）</div>
      <div class="cmp-table-wrap"><table class="cmp-table cmp-bigtable">
        <thead><tr><th class="cmp-rowlabel">段階／遷移</th>${dayHead}<th class="cmp-total">合計</th></tr></thead>
        <tbody>${rows||'<tr><td class="cmp-rowlabel">段階がありません</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

  const dates=f.dates||[];
  /* 表ヘッダ：番号／段階名／合計／各日付／＋日／操作 */

    let cells=`<td class="sm-numc"><div class="row-meta">`+
      `<span class="drag-grip" title="ドラッグで並べ替え" aria-hidden="true"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2" r="1.4"/><circle cx="7.5" cy="2" r="1.4"/><circle cx="2.5" cy="7" r="1.4"/><circle cx="7.5" cy="7" r="1.4"/><circle cx="2.5" cy="12" r="1.4"/><circle cx="7.5" cy="12" r="1.4"/></svg></span>`+

    cells+=`<td class="sm-totalc"><input class="mx-total-in num" data-sid="${s.id}" type="number" min="0" inputmode="numeric" value="${stepCountInputValue(s,'total')}" ${editable?'':'readonly'} placeholder="0" aria-label="${esc(s.name)||'段階'+(i+1)}の合計"></td>`;
    dates.forEach(d=>{
      const v=s.counts&&s.counts[d];
      cells+=`<td class="sm-dayc"><input class="mx-in num" data-sid="${s.id}" data-date="${esc(d)}" type="number" min="0" inputmode="numeric" value="${v===''||v==null?'':v}" placeholder="–" aria-label="${esc(s.name)||'段階'+(i+1)} ${esc(d)}"></td>`;
    });
    cells+=`<td class="sm-addc"></td>`;
    cells+=`<td class="sm-opsc">`+
      `<button class="micro-btn up" data-sid="${s.id}" ${i===0?'disabled':''} title="上へ" aria-label="上へ移動">▲</button>`+
      `<button class="micro-btn down" data-sid="${s.id}" ${i===last?'disabled':''} title="下へ" aria-label="下へ移動">▼</button>`+
      `<button class="micro-btn del" data-sid="${s.id}" title="この段階を削除" aria-label="削除">✕</button>`+
      `</td>`;
    return `<tr data-sid="${s.id}">${cells}</tr>`;
  }).join("");
  body.innerHTML=`<div class="step-matrix-wrap"><table class="step-matrix"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;

  /* ----- イベントバインド ----- */
  /* 段階名 */
  body.querySelectorAll(".step-name-in").forEach(inp=>{
    inp.oninput=()=>{
      const st=f.steps.find(x=>x.id===inp.dataset.sid); if(!st) return;
      st.name=inp.value; saveSoon(); renderViz(); renderKPI(); renderSidebar();
    };
  });
  /* 合計入力（日別ありの段階は readonly・自動集計） */
  body.querySelectorAll(".mx-total-in").forEach(inp=>{
    inp.oninput=()=>{
      const st=f.steps.find(x=>x.id===inp.dataset.sid); if(!st||hasDaily(st)) return;
      setStepCount(st,'total',inp.value);
      saveSoon(); renderViz(); renderKPI(); renderSidebar();
    };
    inp.onkeydown=e=>handleMatrixNav(e,inp);
  });
  /* 日別セル入力 */
  body.querySelectorAll(".mx-in").forEach(inp=>{
    inp.oninput=()=>{
      const st=f.steps.find(x=>x.id===inp.dataset.sid); if(!st) return;
      setStepCount(st,inp.dataset.date,inp.value);
      updateEditorTotals(f); saveSoon(); renderViz(); renderKPI(); renderSidebar();
    };
    inp.onpaste=e=>handleEditorPaste(e,inp,f);
    inp.onkeydown=e=>handleMatrixNav(e,inp);
  });
  /* 並び替え／削除 */
  body.querySelectorAll(".micro-btn.up").forEach(b=>b.onclick=()=>moveStep(b.dataset.sid,-1));
  body.querySelectorAll(".micro-btn.down").forEach(b=>b.onclick=()=>moveStep(b.dataset.sid,1));
  body.querySelectorAll(".micro-btn.del").forEach(b=>b.onclick=()=>{
    f.steps=f.steps.filter(x=>x.id!==b.dataset.sid);

  });
  /* ＋日付追加 */
  const addDayBtn=body.querySelector("#smAddDay");
  if(addDayBtn) addDayBtn.onclick=addDate;
  /* ドラッグ並べ替え */
  bindEditorDragReorder(body,f);
}

/* 合計列を再計算（日別あり段階は自動・読み取り専用） */
function updateEditorTotals(f){
  const body=document.getElementById("editorBody"); if(!body) return;
  body.querySelectorAll(".mx-total-in").forEach(inp=>{
    const st=f.steps.find(x=>x.id===inp.dataset.sid); if(!st) return;
    if(hasDaily(st)){ inp.value=stepTotal(st); inp.readOnly=true; }

/* Excel/スプレッドシートからの貼り付け：タブ＝列・改行＝行、貼り付け開始セルから展開 */
function handleEditorPaste(e,startInp,f){
  const text=(e.clipboardData||window.clipboardData).getData('text');
  if(!text||!/[\t\n]/.test(text)) return;   /* 単一値は通常の貼り付けに任せる */
  e.preventDefault();
  const lines=text.replace(/\r/g,'').split('\n');
  while(lines.length && lines[lines.length-1]==='') lines.pop();
  const startTr=startInp.closest('tr'), tbody=startInp.closest('tbody');
  const allTr=[...tbody.children];
  const rowIdx=allTr.indexOf(startTr);
  const startCells=[...startTr.querySelectorAll('.mx-in')];
  const colIdx=startCells.indexOf(startInp);
  if(colIdx<0) return;
  lines.forEach((line,r)=>{
    const tr=allTr[rowIdx+r]; if(!tr) return;
    const cells=[...tr.querySelectorAll('.mx-in')];
    line.split('\t').forEach((val,c)=>{
      const cell=cells[colIdx+c]; if(!cell) return;
      const clean=String(val).replace(/[^0-9.]/g,'');
      cell.value=clean;
      const st=f.steps.find(x=>x.id===cell.dataset.sid);
      if(st) setStepCount(st,cell.dataset.date,clean);
    });
  });
  updateEditorTotals(f); saveSoon(); renderViz(); renderKPI(); renderSidebar();
}

/* drag & drop 並べ替え。グリップの mousedown でのみ draggable を有効化し、
   入力欄のテキスト選択を妨げない。 */
function bindEditorDragReorder(body,f){
  let dragId=null;
  body.querySelectorAll("tbody tr").forEach(row=>{
    const grip=row.querySelector(".drag-grip"); if(!grip) return;
    grip.addEventListener("mousedown",()=>row.setAttribute("draggable","true"));
    grip.addEventListener("touchstart",()=>row.setAttribute("draggable","true"),{passive:true});
    row.addEventListener("dragstart",e=>{
      dragId=row.dataset.sid; row.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{ e.dataTransfer.setData("text/plain",dragId); }catch(_){}
    });
    row.addEventListener("dragend",()=>{
      row.classList.remove("dragging"); row.removeAttribute("draggable"); dragId=null;
      body.querySelectorAll("tbody tr").forEach(r=>r.classList.remove("drop-before","drop-after"));
    });
    row.addEventListener("dragover",e=>{
      e.preventDefault(); e.dataTransfer.dropEffect="move";
      if(row.dataset.sid===dragId) return;
      const rect=row.getBoundingClientRect();
      const after=(e.clientY-rect.top)>rect.height/2;
      body.querySelectorAll("tbody tr").forEach(r=>r.classList.remove("drop-before","drop-after"));
      row.classList.add(after?"drop-after":"drop-before");
    });
    row.addEventListener("drop",e=>{
      e.preventDefault();
      const targetId=row.dataset.sid;
      if(!dragId||dragId===targetId) return;
      const rect=row.getBoundingClientRect();
      const after=(e.clientY-rect.top)>rect.height/2;
      reorderStep(dragId,targetId,after);
    });
  });
}
function reorderStep(dragId,targetId,after){
  const f=activeFunnel(); if(!f) return;
  const from=f.steps.findIndex(x=>x.id===dragId);
  if(from<0) return;
  const moved=f.steps.splice(from,1)[0];
  let to=f.steps.findIndex(x=>x.id===targetId);
  if(to<0){ f.steps.splice(from,0,moved); return; }
  if(after) to+=1;
  f.steps.splice(to,0,moved);
  simTargetIndex=null; saveSoon(); renderEditor(); renderViz(); renderKPI(); renderSidebar();
}
function moveStep(id,dir){
  const f=activeFunnel();
  const i=f.steps.findIndex(x=>x.id===id), j=i+dir;
  if(j<0||j>=f.steps.length) return;
  [f.steps[i],f.steps[j]]=[f.steps[j],f.steps[i]];
  simTargetIndex=null; saveSoon(); renderEditor(); renderViz(); renderKPI(); renderSidebar();
}

/* ================= VISUALIZATION ================= */
function renderViz(){
  const f=activeFunnel();
  const area=document.getElementById("vizArea");
  if(!f||!area) return;
  const m=computeMetrics(f);

  /* --- insight --- */
  let insight;
  if(f.steps.length<2){
    insight=idleInsight("分析を開始するには","ステップを2つ以上追加してください。各ステップに通過人数を入れると遷移率が計算されます。");
  }else if(!m.hasRate){
    insight=idleInsight("数値の入力待ち","各ステップに通過人数を入力すると、ボトルネックを自動検出します。");
  }else{
    const bn=m.steps[m.bottleneck], prev=m.steps[m.bottleneck-1];
    let sub="";
    if(m.bigDrop!==-1 && m.bigDrop!==m.bottleneck && m.maxLost>0){
      const bd=m.steps[m.bigDrop], bp=m.steps[m.bigDrop-1];
      sub=`<div class="insight-sub">人数ベースで見ると、「<b>${esc(bp.name)||'前'}</b>」→「<b>${esc(bd.name)||'次'}</b>」で最も多い<b>${fmt(bd.lost)}人</b>が離脱しています。母数が大きいこの箇所も改善候補です。</div>`;
    }
    insight=`<div class="insight bottleneck ${insightOpen?'open':''}">
      <button class="insight-head" id="insightToggle" aria-expanded="${insightOpen}" aria-controls="insightDetail">
        <div class="insight-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
        <div class="insight-title">最大のボトルネックを検出</div>
        <span class="insight-toggle-label">
          <span class="insight-toggle-text">${insightOpen?'閉じる':'詳しく見る'}</span>
          <span class="insight-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </span>
      </button>
      <div class="insight-detail" id="insightDetail">
        <div class="insight-body">「<b>${esc(prev.name)||'前ステップ'}</b>」→「<b>${esc(bn.name)||'次ステップ'}</b>」の遷移率が <span class="hl-rose">${pct(bn.rate)}</span> と最も低く、ここで <span class="hl-rose">${fmt(bn.lost)}人</span> が離脱しています。まずこの箇所を改善すると、全体の成果を最も大きく伸ばせます。</div>
        ${sub}
        <div class="insight-foot">※ ボトルネック＝直前ステップからの遷移率が最も低い箇所として自動判定しています。ステップの性質によって妥当な遷移率は異なるため、人数ベースの離脱も併せてご確認ください。</div>
      </div>
    </div>`;
  }

  /* --- funnel chart --- */
  let chart;
  if(f.steps.length===0){
    chart=`<div class="viz-idle"><div class="vi-icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"/></svg></div>
      <div class="vi-title">ステップがありません</div>
      <div class="vi-sub">左の「ステップを追加」から導線を組み立てましょう。</div></div>`;
  }else{
    let rows="";
    m.steps.forEach((s,i)=>{
      const w=Math.max(11,s.count/m.maxCount*100);
      if(i>0){
        const prev=m.steps[i-1];
        const wp=Math.max(11,prev.count/m.maxCount*100);
        const ratio=Math.min(1, wp>0 ? w/wp : 1);
        const bh=ratio*50;
        const clip=`polygon(0% 0%,100% 0%,${(50+bh).toFixed(1)}% 100%,${(50-bh).toFixed(1)}% 100%)`;
        const isBn=i===m.bottleneck;
        const rateTxt=s.rate===null?'—':pct(s.rate);
        let lostTag='';
        if(s.rate!==null){
          if(s.lost>=0){
            lostTag=`<span class="fconn-lost-tag"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>${fmt(s.lost)}人 離脱</span>`;
          }else{
            lostTag=`<span class="fconn-lost-tag gain"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>${fmt(-s.lost)}人 増加</span>`;
          }
        }
        const lx=(50-ratio*50).toFixed(1), rx=(50+ratio*50).toFixed(1);
        const streamPath=`M0 0 H100 C100 16 ${rx} 30 ${rx} 50 L${lx} 50 C${lx} 30 0 16 0 0 Z`;
        rows+=`<div class="frow conn ${isBn?'bn':''}">
          <div class="fcell-label"><div class="fconn-call">
            ${isBn?'<div class="fconn-bn-label"><span class="ping"></span>最大のボトルネック</div>':''}
            <div class="fconn-rate num">${rateTxt} <small>が次へ進んだ</small></div>
            ${lostTag}
          </div></div>
          <div class="fcell-visual">
            <div class="fconn-graphic" style="width:${wp.toFixed(1)}%">
              <svg viewBox="0 0 100 50" preserveAspectRatio="none">
                <rect class="fconn-leak" x="0" y="0" width="100" height="50"/>
                <path class="fconn-stream-path" d="${streamPath}"/>
              </svg>
            </div>
          </div></div>`;
      }
      const nameHtml=esc(s.name)?`<span class="nm">${esc(s.name)}</span>`
        :'<span class="nm nm-empty">（名称未入力）</span>';
      const reach=(m.first>0)?s.count/m.first*100:null;
      let barInner='';
      if(i===0){
        barInner=`<span class="fbar-pct num">100%</span><span class="fbar-tag">スタート地点</span>`;
      }else if(w>=16 && reach!==null){
        barInner=`<span class="fbar-pct num">${pct(reach)}<small>到達</small></span>`;
      }
      rows+=`<div class="frow step">
        <div class="fcell-label">
          <div class="fstep-card ${i===0?'first':''}">
            <div class="fstep-name"><span class="fstep-num">${i+1}</span>${nameHtml}</div>
            <div class="fstep-figs">
              <div class="fstep-count num">${fmt(s.count)}<small>人</small></div>
            </div>
          </div>
        </div>
        <div class="fcell-visual">
          <div class="fbar ${i===0?'first':''}" style="width:${w.toFixed(1)}%">${barInner}</div>
        </div></div>`;
    });
    chart=`<div class="funnel-card">
      <div class="fc-head">
        <div class="fc-caption">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          上から順に各ステップを通過した人数です。バーが大きく狭まる箇所ほど、多くの人がそこで離脱しています。</div>
        <div class="fc-legend">
          <div class="fc-leg"><span class="fc-sw go"></span>進んだ人</div>
          <div class="fc-leg"><span class="fc-sw lost"></span>離脱した人</div>
        </div>
      </div>
      <div class="funnel-flow">
        <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
          <linearGradient id="fcGrad" x1="0" y1="0" x2="0.15" y2="1">
            <stop offset="0" stop-color="#46b3a6"/><stop offset="1" stop-color="#13766a"/>
          </linearGradient>
        </defs></svg>
        ${rows}
      </div>
    </div>`;
  }

  /* --- simulator --- */
  let sim="";
  if(f.steps.length>=2 && m.hasRate){
    const transitions=m.steps.filter(s=>s.rate!==null);
    if(transitions.length){
      if(simTargetIndex===null || !m.steps[simTargetIndex] || m.steps[simTargetIndex].rate===null)
        simTargetIndex=m.bottleneck;
      const tgt=m.steps[simTargetIndex], prev=m.steps[simTargetIndex-1];
      const curRate=tgt.rate;
      const opts=transitions.map(s=>{
        const p=m.steps[s.index-1];
        return `<option value="${s.index}" ${s.index===simTargetIndex?'selected':''}>「${esc(p.name)||'前'}」→「${esc(s.name)||'次'}」（現在 ${pct(s.rate)}）</option>`;
      }).join("");
      sim=`<div class="sim-card">
        <div class="sim-head">
          <div class="sim-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l6-6 4 4 7-7M14 8h7v7"/></svg></div>
          <div class="sim-title">改善シミュレーター</div>
        </div>
        <div class="sim-desc">遷移率を上げたら最終成果がどれだけ伸びるか試算します。上流の人数と下流ステップの遷移率は現状のままと仮定した概算です。</div>
        <div class="sim-field">
          <div class="sim-flabel">改善する箇所</div>
          <select class="sim-select" id="simSelect" aria-label="改善する箇所">${opts}</select>
        </div>
        <div class="sim-field">
          <div class="sim-flabel">改善後の遷移率（現状 ${pct(curRate)}）</div>
          <div class="sim-slider-row">
            <input type="range" class="sim-slider" id="simSlider" aria-label="改善後の遷移率"
              min="${Math.floor(curRate)}" max="100" step="0.1" value="${curRate.toFixed(1)}">
            <div class="sim-ratebox"><div class="v num" id="simRateV">${pct(curRate)}</div><div class="l">改善後</div></div>
          </div>
          <div class="sim-quick">
            <button class="qbtn" data-add="0">現状</button>
            <button class="qbtn" data-add="5">+5pt</button>
            <button class="qbtn" data-add="10">+10pt</button>
            <button class="qbtn" data-add="20">+20pt</button>
          </div>
        </div>
        <div class="sim-result" id="simResult"></div>
      </div>`;
    }
  }

  area.innerHTML=insight+chart+sim;

  /* bind insight toggle (折りたたみ：要点はKPI行に常時表示、詳細は必要時のみ展開) */
  const it=document.getElementById("insightToggle");
  if(it) it.onclick=()=>{
    insightOpen=!insightOpen;
    const ins=it.closest(".insight");
    ins.classList.toggle("open",insightOpen);
    it.setAttribute("aria-expanded",insightOpen);
    const tt=ins.querySelector(".insight-toggle-text");
    if(tt) tt.textContent=insightOpen?'閉じる':'詳しく見る';
  };

  /* bind simulator (スライダーは全再描画しない＝位置リセット防止) */
  const sel=document.getElementById("simSelect");
  const sld=document.getElementById("simSlider");
  if(sel) sel.onchange=()=>{ simTargetIndex=Number(sel.value); renderViz(); };
  if(sld){
    sld.oninput=updateSim;
    sld.dataset.idx=simTargetIndex;
    document.querySelectorAll(".qbtn").forEach(b=>{
      b.onclick=()=>{
        const tgt=computeMetrics(f).steps[simTargetIndex];
        const base=tgt.rate;
        const add=Number(b.dataset.add);
        sld.value=Math.min(100,Math.max(Number(sld.min),base+add)).toFixed(1);
        updateSim();
      };
    });
    updateSim();
  }
}
function idleInsight(t,s){
  return `<div class="insight idle">
    <div class="insight-head"><div class="insight-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div class="insight-title">${t}</div></div>
    <div class="insight-body" style="color:var(--ink-2)">${s}</div></div>`;
}
function updateSim(){
  const f=activeFunnel();
  const sld=document.getElementById("simSlider");
  const res=document.getElementById("simResult");
  if(!f||!sld||!res) return;
  const idx=simTargetIndex;
  const val=Number(sld.value);
  const min=Number(sld.min);
  sld.style.setProperty("--fill",((val-min)/(100-min)*100)+"%");
  document.getElementById("simRateV").textContent=pct(val);
  const r=simulate(f,idx,val);
  const moneyUp = (r.revenueGain!==null && r.revenueGain>0.5) ? ` 売上は <b>+${yen(r.revenueGain)}</b> 増える計算です。` : '';
  const moneyDn = (r.revenueGain!==null && r.revenueGain<-0.5) ? ` 売上は ${yen(-r.revenueGain)} 減る計算です。` : '';
  const gainTxt = r.gain>0.5
    ? `この改善で最終成果が <b>+${fmt(r.gain)}人</b> 増える試算です。${moneyUp}`
    : (r.gain<-0.5 ? `この設定では最終成果が ${fmt(-r.gain)}人 減ります。${moneyDn}`
                   : `現状と同じ水準です。スライダーを動かすと効果が表示されます。`);
  const revRow = r.origRevenue!==null
    ? `<div class="sim-rcell"><div class="rl">想定売上</div>
        <div class="rv num"><span class="now">${yen(r.origRevenue)}</span><span class="arrow">→</span>${yen(r.newRevenue)}</div></div>`
    : '';
  res.innerHTML=`
    <div class="sim-result-grid">
      <div class="sim-rcell"><div class="rl">最終CV</div>
        <div class="rv num"><span class="now">${fmt(r.origFinal)}</span><span class="arrow">→</span>${fmt(r.newFinal)}</div></div>
      <div class="sim-rcell"><div class="rl">全体コンバージョン率</div>
        <div class="rv num"><span class="now">${pct(r.origCVR)}</span><span class="arrow">→</span>${pct(r.newCVR)}</div></div>
      ${revRow}
    </div>
    <div class="sim-gain">${gainTxt}</div>`;
}

/* ================= SNAPSHOT / HISTORY ================= */
function takeSnapshot(){
  const f=activeFunnel(); if(!f) return;
  if(f.steps.length<2 || !computeMetrics(f).hasRate){
    toast("数値を入力してから記録してください"); return;
  }
  f.snapshots.push({
    id:uid("sn"), date:new Date().toISOString(),
    steps:f.steps.map(s=>({name:s.name,count:stepTotal(s)}))   /* 記録はその時点の合計を保存 */
  });
  saveSoon(); renderMain();
  toast("現在の数値を記録しました");
}
function openHistory(){ renderHistory(); document.getElementById("overlayHistory").classList.add("show"); }
function closeHistory(){ document.getElementById("overlayHistory").classList.remove("show"); }
function renderHistory(){
  const f=activeFunnel();
  const body=document.getElementById("historyBody");
  if(!f) return;
  const snaps=f.snapshots.slice();
  if(snaps.length===0){
    body.innerHTML=`<div class="hist-empty"><div class="he-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg></div>
      <div class="he-t">まだ記録がありません</div>
      <div class="he-s">「現在の数値を記録」で今のファネルを保存すると、<br>全体コンバージョン率の推移をここで追えるようになります。</div></div>`;
    return;
  }
  const cvrs=snaps.map(snapCVR);
  const valid=cvrs.filter(v=>v!==null);
  const curCVR=cvrs[cvrs.length-1];
  let spark="";
  if(valid.length>=1){
    const mn=Math.min(...valid), mx=Math.max(...valid), rng=(mx-mn)||1;
    const W=380,H=54,n=cvrs.length;
    const pts=cvrs.map((v,i)=>{
      const x=n===1?W/2:i/(n-1)*(W-12)+6;
      const y=v===null?H-6:H-6-((v-mn)/rng)*(H-14);
      return [x,y];
    });
    const line=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#0f7a64"/>`).join('');
    spark=`<div class="spark-wrap">
      <div class="spark-top"><span class="spark-label">全体コンバージョン率の推移（${n}件）</span>
        <span class="spark-cur">最新 ${pct(curCVR)}</span></div>
      <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block">
        <path d="${line}" fill="none" stroke="#0f7a64" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}</svg></div>`;
  }
  let rows="";
  for(let i=snaps.length-1;i>=0;i--){
    const sn=snaps[i], cvr=cvrs[i];
    let delta="";
    if(i>0 && cvr!==null && cvrs[i-1]!==null){
      const d=cvr-cvrs[i-1];
      const cls=d>0.05?'up':(d<-0.05?'down':'flat');
      const sign=d>0?'▲ +':(d<0?'▼ ':'– ');
      delta=`<span class="snap-delta ${cls}">${sign}${Math.abs(d).toFixed(1)}pt</span>`;
    }
    rows+=`<div class="snap-row">
      <div><div class="snap-date">${fullDate(sn.date)}</div>
        <div class="snap-sub">${sn.steps.length}ステップ・流入 ${fmt(num(sn.steps[0]?.count))}人 → CV ${fmt(num(sn.steps[sn.steps.length-1]?.count))}人</div></div>
      ${delta}
      <div class="snap-cvr num">${pct(cvr)}</div>
      <div class="snap-act">
        <button class="snap-btn restore" data-id="${sn.id}" title="この時点を復元" aria-label="この記録を復元">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button class="snap-btn del" data-id="${sn.id}" title="削除" aria-label="この記録を削除">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div></div>`;
  }
  body.innerHTML=spark+`<div class="snap-list">${rows}</div>`;
  body.querySelectorAll(".snap-btn.restore").forEach(b=>b.onclick=()=>{
    const sn=f.snapshots.find(x=>x.id===b.dataset.id); if(!sn) return;
    if(confirm("この記録の数値で現在のステップを置き換えますか？")){
      f.steps=sn.steps.map(s=>({id:uid("s"),name:s.name,counts:{},total:num(s.count),metrics:[],memo:""}));
      simTargetIndex=null; saveSoon(); closeHistory(); renderAll();
      toast("記録した数値を復元しました");
    }
  });
  body.querySelectorAll(".snap-btn.del").forEach(b=>b.onclick=()=>{
    f.snapshots=f.snapshots.filter(x=>x.id!==b.dataset.id);
    saveSoon(); renderHistory(); renderMain();
  });
}

/* ================= FUNNEL OPS ================= */
function duplicateFunnel(){
  const f=activeFunnel(); if(!f) return;
  const copy={
    id:uid("f"), name:f.name+" のコピー", type:f.type, createdAt:Date.now(),
    unitValue:f.unitValue, adCost:f.adCost,
    phone:{count:f.phone?f.phone.count:"",note:f.phone?f.phone.note:""},
    dates:(f.dates||[]).slice(),
    steps:f.steps.map(s=>({id:uid("s"),name:s.name,counts:Object.assign({},s.counts),total:s.total,metrics:normMetrics(s.metrics),memo:s.memo||""})),
    snapshots:[]
  };
  const i=state.funnels.findIndex(x=>x.id===f.id);
  state.funnels.splice(i+1,0,copy);
  state.activeId=copy.id; simTargetIndex=null;
  saveSoon(); renderAll(); toast("導線を複製しました");
}
function deleteFunnel(){
  const f=activeFunnel(); if(!f) return;
  if(confirm(`「${f.name||"無題の導線"}」を削除しますか？この操作は元に戻せません。`)){
    state.funnels=state.funnels.filter(x=>x.id!==f.id);
    state.activeId=state.funnels[0]?state.funnels[0].id:null;
    simTargetIndex=null; saveSoon(); renderAll(); toast("導線を削除しました");
  }
}

/* ================= CREATE MODAL ================= */
function refreshPreview(){

  const blank=document.getElementById("mBlank").checked;

}
function openCreate(){
  document.getElementById("mName").value="";
  document.getElementById("mType").value="広告";

  refreshPreview();
  document.getElementById("overlayCreate").classList.add("show");
  setTimeout(()=>document.getElementById("mName").focus(),60);
}
function closeCreate(){ document.getElementById("overlayCreate").classList.remove("show"); }
function createFunnel(){
  const name=document.getElementById("mName").value.trim();
  const type=document.getElementById("mType").value;
  const blank=document.getElementById("mBlank").checked;
  const tpl=blank?["ステップ 1","ステップ 2","ステップ 3"]:TEMPLATES[type];
  const f={
    id:uid("f"), name:name||(type+"導線"), type, createdAt:Date.now(),
    unitValue:'', adCost:'', phone:{count:"",note:""}, dates:[],
    steps:tpl.map(n=>({id:uid("s"),name:n,counts:{},total:"",metrics:[],memo:""})), snapshots:[]
  };
  state.funnels.push(f);
  state.activeId=f.id; simTargetIndex=null;
  saveSoon(); closeCreate(); renderAll(); toast("導線を作成しました");
}

/* ================= EXPORT / IMPORT ================= */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`funnelscope-backup-${dateStamp()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
  toast("バックアップを書き出しました");
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.funnels)) throw 0;
      let added=0;
      d.funnels.forEach(f=>{
        if(!f||!Array.isArray(f.steps)) return;
        state.funnels.push({
          id:uid("f"), name:(f.name||"読み込んだ導線"), type:f.type||"その他", createdAt:Date.now(),
          unitValue:f.unitValue??'', adCost:f.adCost??'',
          phone:normPhone(f.phone),
          steps:f.steps.map(s=>normStep(s,false)),
          snapshots:(f.snapshots||[]).map(sn=>({
            id:uid("sn"), date:sn.date||new Date().toISOString(),
            steps:(sn.steps||[]).map(s=>({name:s.name||"",count:num(s.count)}))
          }))
        });
        added++;
      });
      if(added===0) throw 0;
      if(!state.activeId) state.activeId=state.funnels[0].id;
      saveSoon(); renderAll();
      toast(`${added}件の導線を読み込みました`);
    }catch(e){ toast("ファイルを読み込めませんでした"); }
  };
  r.readAsText(file);
}

/* ================= SIDEBAR (mobile drawer) ================= */
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("scrim").classList.add("show"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("scrim").classList.remove("show"); }

/* ================= TOAST / RENDER ALL ================= */
function toast(msg){
  const t=document.getElementById("toast");
  t.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span>${esc(msg)}</span>`;
  t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),2300);
}
function renderAll(){ renderSidebar(); renderMain(); }

/* ================= INIT ================= */
document.getElementById("addFunnelBtn").onclick=openCreate;
document.getElementById("mCancel").onclick=closeCreate;
document.getElementById("mCreate").onclick=createFunnel;
document.getElementById("mType").onchange=refreshPreview;
document.getElementById("mBlank").onchange=refreshPreview;
document.getElementById("hClose").onclick=closeHistory;
document.getElementById("hSnap").onclick=()=>{ takeSnapshot(); renderHistory(); };
document.getElementById("exportBtn").onclick=exportData;
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
  if(e.target.files[0]) importData(e.target.files[0]);
  e.target.value="";
};
document.getElementById("scrim").onclick=closeSidebar;
document.getElementById("overlayCreate").onclick=e=>{ if(e.target.id==="overlayCreate") closeCreate(); };
document.getElementById("overlayHistory").onclick=e=>{ if(e.target.id==="overlayHistory") closeHistory(); };
document.addEventListener("click",()=>{
  const m=document.getElementById("funnelMenu");
  if(m) m.classList.remove("show");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeCreate(); closeHistory(); closeSidebar(); }
  if(e.key==="Enter" && document.getElementById("overlayCreate").classList.contains("show")) createFunnel();
});

loadData();
seedSchool();
renderAll();
if(!store.ok) toast("プレビュー環境では保存されません。ダウンロードしてご利用ください");
</script>
</body>
