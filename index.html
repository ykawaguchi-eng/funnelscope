<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ファネルスコープ — 導線ボトルネック分析ツール</title>
<meta name="description" content="集客の導線（ファネル）の各ステップに人数を入れるだけで、遷移率を自動計算し、ボトルネックを一目で可視化する分析ツール。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f4;
    --bg-2:#f0f0ec;
    --panel:#ffffff;
    --panel-2:#fbfbf9;
    --ink:#17181b;
    --ink-2:#5d5e63;
    --ink-3:#94959c;
    --ink-4:#b6b7bd;
    --line:#e8e7e1;
    --line-2:#f0efea;
    --line-strong:#dcdbd3;
    --accent:#0f7a64;
    --accent-2:#16a085;
    --accent-3:#3bb89e;
    --accent-deep:#0a5b4a;
    --accent-soft:#e7f2ef;
    --accent-soft-2:#d6ebe6;
    --danger:#d23f30;
    --danger-2:#e8593f;
    --danger-soft:#fbe7e2;
    --danger-line:#f1c2b6;
    --leak:#efdcd5;
    --leak-strong:#e2b3a4;
    --amber:#b07d10;
    --up:#1f9d57;
    --up-soft:#e3f3e8;
    --r-lg:16px;
    --r-md:11px;
    --r-sm:8px;
    --shadow-sm:0 1px 2px rgba(23,24,27,.05);
    --shadow:0 1px 2px rgba(23,24,27,.04),0 8px 24px -16px rgba(23,24,27,.18);
    --shadow-pop:0 24px 60px -20px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.06);
    --font:'Schibsted Grotesk',-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-feature-settings:"tnum" 1,"ss01" 1;overflow:hidden;letter-spacing:-.005em;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  ::selection{background:var(--accent-soft-2)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .app{display:flex;height:100vh;width:100vw}

  /* ============ SIDEBAR ============ */
  .sidebar{width:264px;flex-shrink:0;background:var(--panel-2);
    border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:20px 18px 17px;display:flex;align-items:center;gap:11px;
    border-bottom:1px solid var(--line)}
  .brand-mark{width:36px;height:36px;flex-shrink:0;border-radius:10px;
    background:linear-gradient(150deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 13px -5px rgba(15,122,100,.7)}
  .brand-name{font-weight:800;font-size:15px;letter-spacing:-.025em;color:var(--ink)}
  .brand-sub{font-size:10px;color:var(--ink-3);margin-top:2px;font-weight:600;letter-spacing:.01em}

  .side-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
  .side-head span{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
  .btn-add{width:27px;height:27px;border-radius:7px;background:var(--panel);
    border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
    color:var(--ink-2);transition:.18s;font-size:18px;line-height:1}
  .btn-add:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(90deg)}

  .funnel-list{flex:1;overflow-y:auto;padding:3px 10px 12px}
  .funnel-list::-webkit-scrollbar{width:7px}
  .funnel-list::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
  .f-item{padding:11px 12px;border-radius:10px;margin-bottom:2px;transition:.13s;
    position:relative;cursor:pointer;border:1px solid transparent}
  .f-item:hover{background:var(--bg-2)}
  .f-item.active{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow-sm)}
  .f-item.active::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;
    width:3px;background:var(--accent);border-radius:0 3px 3px 0}
  .f-item-top{display:flex;align-items:center;gap:8px}
  .f-item-name{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:-.01em}
  .f-item-cvr{font-size:11.5px;font-weight:800;color:var(--accent);flex-shrink:0}
  .f-item-meta{font-size:10.5px;color:var(--ink-3);margin-top:5px;display:flex;align-items:center;gap:7px}
  .f-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;
    background:var(--bg-2);color:var(--ink-2);letter-spacing:.02em;border:1px solid var(--line)}
  .f-item-bar{height:3px;border-radius:2px;background:var(--bg-2);margin-top:8px;overflow:hidden}
  .f-item-bar i{display:block;height:100%;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent-3))}
  .f-empty-side{padding:16px 13px;font-size:12px;color:var(--ink-3);line-height:1.75}

  .side-foot{padding:13px 16px;border-top:1px solid var(--line)}
  .side-foot-row{display:flex;gap:7px;margin-bottom:11px}
  .foot-btn{flex:1;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;
    padding:9px;font-size:11.5px;font-weight:700;color:var(--ink-2);transition:.14s;
    display:flex;align-items:center;justify-content:center;gap:5px}
  .foot-btn:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
  .side-note{font-size:10px;color:var(--ink-3);line-height:1.6;display:flex;gap:6px;align-items:flex-start}
  .side-note svg{flex-shrink:0;margin-top:1px;opacity:.7}
  .side-ver{font-size:9px;color:var(--ink-4);margin-top:8px;letter-spacing:.05em;font-weight:700;text-transform:uppercase}

  /* ============ MAIN ============ */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

  .topbar{padding:0 28px;height:62px;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:10}
  .tb-burger{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line-strong);
    align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0}
  .tb-left{flex:1;min-width:0}
  .tb-name{font-size:18.5px;font-weight:800;letter-spacing:-.03em;color:var(--ink);
    border:none;background:none;width:100%;padding:3px 7px;border-radius:7px;margin-left:-7px;transition:.12s}
  .tb-name:hover{background:var(--bg)}
  .tb-name:focus{outline:none;background:var(--accent-soft)}
  .tb-typeline{font-size:11px;color:var(--ink-3);margin-top:1px;font-weight:600;
    display:flex;align-items:center;gap:8px;padding-left:1px;flex-wrap:wrap}
  .tb-typebadge{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:5px;
    background:var(--accent-soft);color:var(--accent-deep);letter-spacing:.03em}

  .tb-actions{display:flex;align-items:center;gap:7px;position:relative}
  .tb-btn{height:35px;border:1px solid var(--line-strong);border-radius:9px;padding:0 13px;
    display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    color:var(--ink-2);transition:.13s;white-space:nowrap;background:var(--panel)}
  .tb-btn:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
  .tb-btn.icon{width:35px;padding:0;justify-content:center}
  .menu{position:absolute;top:43px;right:0;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;width:190px;z-index:30;
    display:none;animation:pop .14s ease}
  .menu.show{display:block}
  .menu-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;
    font-size:12.5px;font-weight:600;color:var(--ink);width:100%;transition:.1s}
  .menu-item:hover{background:var(--bg)}
  .menu-item.danger{color:var(--danger)}
  .menu-item.danger:hover{background:var(--danger-soft)}
  .menu-sep{height:1px;background:var(--line);margin:5px 4px}

  .scroll{flex:1;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:11px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:3px solid var(--bg)}
  .canvas{max-width:1300px;margin:0 auto;padding:26px 28px 72px}

  /* ============ KPI BAR ============ */
  .kpibar{display:grid;grid-template-columns:1fr 1fr 1.05fr 1.7fr;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
  .kpibar.has-rev{grid-template-columns:1fr 1fr 1.15fr 1.05fr 1.7fr}
  .kpi.rev .kpi-value{color:var(--accent-deep)}
  .kpi{padding:17px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
  .kpi:last-child{border-right:none}
  .kpi-label{font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.09em;
    text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .kpi-value{font-size:27px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-.035em}
  .kpi-value small{font-size:12px;font-weight:700;color:var(--ink-3);margin-left:3px;letter-spacing:0}
  .kpi.cvr{background:linear-gradient(180deg,var(--accent-soft) 0%,rgba(231,242,239,.35) 100%)}
  .kpi.cvr .kpi-label{color:var(--accent-deep)}
  .kpi.cvr .kpi-value{color:var(--accent-deep);font-size:32px}
  .kpi.cvr .kpi-value.dim{color:var(--ink-4);font-size:27px}

  .kpi.bn{cursor:pointer;transition:.15s}
  .kpi.bn:hover{background:var(--bg)}
  .kpi.bn.live:hover{background:var(--danger-soft)}
  .kpi-bn-head{display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .kpi-bn-head .kpi-label{margin-bottom:0}
  .bn-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);position:relative;flex-shrink:0}
  .bn-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--danger);
    animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
  .kpi-bn-route{font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.35;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi-bn-detail{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-top:4px;display:flex;
    align-items:center;gap:9px;flex-wrap:wrap}
  .kpi-bn-detail b{color:var(--danger);font-weight:800}
  .kpi-bn-detail .arrow{display:inline-flex;align-items:center;gap:4px;color:var(--accent-deep);font-weight:800}
  .kpi-bn-idle{font-size:12.5px;font-weight:600;color:var(--ink-3);line-height:1.5}

  /* ============ WORKSPACE ============ */
  .ws-stack{display:flex;flex-direction:column;gap:22px}
  .ws-edit{display:flex;flex-direction:column;gap:11px}
  .ws-viz{display:flex;flex-direction:column;gap:18px}
  .panel-title{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);
    text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .panel-title .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}

  /* ----- EDITOR ----- */
  .editor-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);overflow:hidden}

  /* ステップ入力マトリクス（段階×日付） */
  .step-matrix-wrap{overflow-x:auto;border-bottom:1px solid var(--line)}
  .step-matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
  .step-matrix thead th{background:var(--panel-2);font-size:10px;font-weight:800;color:var(--ink-3);
    padding:10px 8px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
    border-bottom:1px solid var(--line);text-align:right}
  .step-matrix thead th.sm-numh{text-align:left;width:46px;padding-left:14px}
  .step-matrix thead th.sm-nameh{text-align:left;min-width:170px}
  .step-matrix thead th.sm-totalh{background:var(--accent-soft);color:var(--accent-deep);
    border-right:1px solid var(--line);width:96px}
  .step-matrix thead th.sm-dayh{min-width:74px}
  .step-matrix thead th.sm-addh{width:42px;padding:4px;text-align:center;background:var(--panel-2)}
  .step-matrix thead th.sm-opsh{width:96px;background:var(--panel-2)}
  .step-matrix td{border-bottom:1px solid var(--line-2);padding:0;vertical-align:middle;background:var(--panel);height:46px}
  .step-matrix tbody tr:last-child td{border-bottom:none}
  .step-matrix tbody tr:hover td{background:var(--panel-2)}
  .step-matrix tbody tr.dragging td{opacity:.45}
  .step-matrix tbody tr.drop-before td{box-shadow:inset 0 2.5px 0 var(--accent)}
  .step-matrix tbody tr.drop-after td{box-shadow:inset 0 -2.5px 0 var(--accent)}
  .step-matrix td.sm-numc{padding:0 6px 0 12px;width:46px}
  .step-matrix .row-meta{display:flex;align-items:center;gap:6px}
  .step-matrix .drag-grip{opacity:.4;cursor:grab;color:var(--ink-4);transition:.12s;
    display:flex;align-items:center;border-radius:5px;padding:2px}
  .step-matrix tbody tr:hover .drag-grip{opacity:.9}
  .step-matrix .drag-grip:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .step-matrix .drag-grip:active{cursor:grabbing}
  .step-idx{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);
    color:var(--accent-deep);font-size:11px;font-weight:800;display:flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .step-matrix td.sm-namec{padding:0 6px;min-width:170px}
  .step-name-in{border:1px solid transparent;background:transparent;border-radius:7px;
    padding:8px 9px;font-size:13px;font-weight:700;color:var(--ink);width:100%;
    font-family:inherit;transition:.12s;letter-spacing:-.01em}
  .step-name-in:hover{background:var(--bg)}
  .step-name-in:focus{outline:none;background:#fff;border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent-soft)}
  .step-name-in::placeholder{color:var(--ink-4);font-weight:500}
  .step-matrix td.sm-totalc{background:linear-gradient(180deg,var(--accent-soft) 0%, #f4f9f7 100%);
    border-right:1px solid var(--line);width:96px}
  .step-matrix td.sm-totalc .mx-total-in{font-size:14px;font-weight:800;color:var(--accent-deep);padding:11px 10px}
  .step-matrix td.sm-dayc{min-width:74px}
  .step-matrix td.sm-dayc .mx-in{padding:11px 9px;font-size:13.5px}
  .step-matrix td.sm-addc{width:42px;background:var(--panel-2)}
  .step-matrix td.sm-opsc{padding:0 8px;text-align:right;width:96px;white-space:nowrap;background:var(--panel-2)}
  .step-matrix td.sm-opsc .micro-btn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:6px;color:var(--ink-3);font-size:10px;font-weight:800;transition:.12s;background:none;margin-left:1px}
  .step-matrix td.sm-opsc .micro-btn:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .step-matrix td.sm-opsc .micro-btn.del:hover{background:var(--danger-soft);color:var(--danger)}
  .step-matrix td.sm-opsc .micro-btn:disabled{opacity:.22;pointer-events:none}
  .sm-addday-btn{width:28px;height:28px;border-radius:7px;background:var(--accent-soft);color:var(--accent-deep);
    font-size:16px;font-weight:800;line-height:1;border:none;transition:.13s;display:inline-flex;
    align-items:center;justify-content:center}
  .sm-addday-btn:hover{background:var(--accent);color:#fff}
  .micro-btn{width:23px;height:23px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;color:var(--ink-4);transition:.12s;font-size:10px}
  .micro-btn:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .micro-btn.del:hover{background:var(--danger-soft);color:var(--danger)}
  .micro-btn:disabled{opacity:.22;cursor:default}
  .micro-btn:disabled:hover{background:none;color:var(--ink-4)}
  .add-step{margin:11px 14px 14px;padding:11px;border:1.5px dashed var(--line-strong);
    border-radius:11px;width:calc(100% - 28px);font-size:12.5px;font-weight:700;
    color:var(--ink-2);transition:.13s;display:flex;align-items:center;justify-content:center;gap:7px;background:transparent}
  .add-step:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .ed-hint{padding:0 17px 15px;font-size:10.5px;color:var(--ink-3);line-height:1.7}
  .ed-money{margin:0 11px 14px;padding:13px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md)}
  .ed-money-label{display:block;font-size:11px;font-weight:800;color:var(--ink-2);letter-spacing:.02em;margin-bottom:9px}
  .ed-money-field{display:flex;align-items:center;gap:7px}
  .ed-money-yen{font-size:15px;font-weight:800;color:var(--ink-3)}
  .ed-money-in{flex:0 0 150px;width:150px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
    font-size:15px;font-weight:700;color:var(--ink);background:var(--panel);text-align:right}
  .ed-money-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ed-money-unit{font-size:12px;font-weight:700;color:var(--ink-3)}
  .ed-money-hint{margin-top:9px;font-size:10.5px;color:var(--ink-3);line-height:1.65}

  /* ----- VIZ AREA ----- */
  .ws-viz{display:flex;flex-direction:column;gap:18px}

  /* ----- INSIGHT ----- */
  .insight{border-radius:var(--r-lg);padding:18px 20px;border:1px solid var(--line);
    background:var(--panel);box-shadow:var(--shadow)}
  .insight.bottleneck{border-color:var(--danger-line);
    background:linear-gradient(120deg,var(--panel) 55%,var(--danger-soft))}
  .insight-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none}
  button.insight-head{cursor:pointer}
  button.insight-head:hover .insight-toggle-text{color:var(--danger)}
  .insight.idle .insight-head{margin-bottom:11px}
  .insight-toggle-label{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;
    font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;transition:.13s}
  .insight-chevron{display:flex;transition:transform .25s ease;color:var(--danger)}
  .insight.open .insight-chevron{transform:rotate(180deg)}
  .insight-detail{max-height:0;overflow:hidden;opacity:0;margin-top:0;
    transition:max-height .32s ease,opacity .22s ease,margin-top .32s ease}
  .insight.open .insight-detail{max-height:560px;opacity:1;margin-top:12px}
  .insight-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0}
  .insight.bottleneck .insight-icon{background:var(--danger);color:#fff;
    box-shadow:0 5px 14px -5px rgba(210,63,48,.6)}
  .insight.idle .insight-icon{background:var(--bg-2);color:var(--ink-3)}
  .insight-title{font-size:12px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .insight.bottleneck .insight-title{color:var(--danger)}
  .insight.idle .insight-title{color:var(--ink-2)}
  .insight-body{font-size:13.5px;line-height:1.78;color:var(--ink);font-weight:500}
  .insight-body b{font-weight:800}
  .hl-rose{color:var(--danger);font-weight:800}
  .insight-sub{font-size:12px;line-height:1.7;color:var(--ink-2);margin-top:10px;
    padding-top:10px;border-top:1px solid var(--line);font-weight:500}
  .insight-sub b{font-weight:800;color:var(--ink)}
  .insight-foot{font-size:10.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}

  /* ----- FUNNEL CHART ----- */
  .funnel-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);padding:20px 24px 24px}
  .fc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px}
  .fc-caption{font-size:11.5px;color:var(--ink-2);line-height:1.6;font-weight:500;
    display:flex;gap:7px;align-items:flex-start;max-width:62%}
  .fc-caption svg{flex-shrink:0;margin-top:1px;color:var(--accent)}
  .fc-legend{display:flex;gap:14px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .fc-leg{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-2)}
  .fc-sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
  .fc-sw.go{background:linear-gradient(160deg,var(--accent-3),var(--accent))}
  .fc-sw.lost{background:var(--leak-strong)}

  .funnel-flow{padding-top:16px;margin-top:14px;border-top:1px solid var(--line-2)}
  .frow{display:flex;align-items:center}
  .fcell-label{width:210px;flex-shrink:0;display:flex;flex-direction:column;
    justify-content:center;padding-right:18px}
  .fcell-visual{flex:1;min-width:150px;display:flex;flex-direction:column;
    justify-content:center;align-items:center}

  /* --- step --- */
  .frow.step .fcell-visual{height:66px}
  .fstep-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:9px 13px;box-shadow:var(--shadow-sm)}
  .fstep-card.first{border-color:var(--accent-soft-2);
    background:linear-gradient(160deg,#fff 56%,var(--accent-soft))}
  .fstep-name{font-size:12px;font-weight:700;color:var(--ink);display:flex;
    align-items:center;white-space:nowrap;overflow:hidden;letter-spacing:-.01em}
  .fstep-name .nm{overflow:hidden;text-overflow:ellipsis}
  .nm-empty{color:var(--ink-4);font-weight:500}
  .fstep-num{width:19px;height:19px;border-radius:6px;background:var(--accent-soft);
    color:var(--accent-deep);font-size:10px;font-weight:800;display:flex;
    align-items:center;justify-content:center;margin-right:8px;flex-shrink:0}
  .fstep-figs{display:flex;align-items:baseline;gap:8px;margin-top:7px}
  .fstep-count{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.04em;line-height:1}
  .fstep-count small{font-size:11px;font-weight:700;color:var(--ink-3);margin-left:2px;letter-spacing:0}
  .fstep-share{font-size:9.5px;font-weight:800;color:var(--ink-2);margin-left:auto;align-self:center;
    background:var(--bg);border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;
    letter-spacing:.01em;white-space:nowrap}
  .fbar{height:54px;border-radius:11px;min-width:52px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;position:relative;color:#fff;overflow:hidden;
    background:linear-gradient(145deg,var(--accent-3) 0%,var(--accent) 52%,var(--accent-deep) 100%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.42),inset 0 -5px 11px rgba(8,55,45,.34),
      0 10px 24px -10px rgba(15,122,100,.66)}
  .fbar::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;
    background:linear-gradient(180deg,rgba(255,255,255,.2),transparent);pointer-events:none}
  .fbar.first{background:linear-gradient(145deg,var(--accent-2) 0%,var(--accent-deep) 100%)}
  .fbar-pct{font-size:14.5px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1;
    text-shadow:0 1px 3px rgba(8,50,40,.45)}
  .fbar-pct small{font-size:9px;font-weight:700;opacity:.82;margin-left:2px}
  .fbar-tag{font-size:8px;font-weight:800;opacity:.94;letter-spacing:.11em;text-transform:uppercase;
    position:relative;z-index:1;text-shadow:0 1px 2px rgba(8,50,40,.4)}

  /* --- connector --- */
  .frow.conn .fcell-visual{height:56px}
  .frow.conn .fcell-label{padding:6px 18px 6px 0}
  .fconn-call{width:100%}
  .fconn-bn-label{font-size:9px;font-weight:800;color:var(--danger);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .fconn-bn-label .ping{width:7px;height:7px;border-radius:50%;background:var(--danger);position:relative}
  .fconn-bn-label .ping::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:var(--danger);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  .fconn-rate{font-size:19px;font-weight:800;color:var(--accent-deep);letter-spacing:-.03em;line-height:1.05}
  .fconn-rate small{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:0}
  .fconn-lost-tag{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
    background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-line);
    border-radius:7px;padding:3px 9px 3px 7px;font-size:11px;font-weight:800;line-height:1.35}
  .fconn-lost-tag svg{flex-shrink:0;opacity:.85}
  .fconn-lost-tag.gain{background:var(--up-soft);color:var(--up);border-color:#bfe2c9}
  .fconn-graphic{height:50px;position:relative}
  .fconn-graphic svg{display:block;width:100%;height:100%}
  .fconn-leak{fill:var(--leak)}
  .fconn-stream-path{fill:url(#fcGrad)}
  .frow.conn.bn .fcell-label{background:var(--danger-soft);border-radius:10px;
    padding:10px 14px;border:1px solid var(--danger-line)}
  .frow.conn.bn .fconn-rate{color:var(--danger)}
  .frow.conn.bn .fconn-lost-tag{background:#fff;border-color:var(--danger-line)}
  .frow.conn.bn .fconn-leak{fill:var(--leak-strong)}

  /* ----- SIMULATOR ----- */
  .sim-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--shadow);padding:20px 24px;position:relative;overflow:hidden}
  .sim-card::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--accent),var(--accent-3))}
  .sim-head{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .sim-ico{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sim-title{font-size:12px;font-weight:800;color:var(--accent-deep);letter-spacing:.02em;text-transform:uppercase}
  .sim-desc{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-bottom:16px;font-weight:500}
  .sim-field{margin-bottom:14px}
  .sim-flabel{font-size:10px;font-weight:800;color:var(--ink-2);letter-spacing:.05em;
    text-transform:uppercase;margin-bottom:8px}
  .sim-select{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;
    font-size:12.5px;font-weight:600;color:var(--ink);background:var(--panel);transition:.12s}
  .sim-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .sim-slider-row{display:flex;align-items:center;gap:13px}
  .sim-slider{flex:1;-webkit-appearance:none;appearance:none;height:7px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent) var(--fill,0%),var(--bg-2) var(--fill,0%));outline:none}
  .sim-slider::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.18)}
  .sim-slider::-moz-range-thumb{width:21px;height:21px;border-radius:50%;background:#fff;
    border:3px solid var(--accent);cursor:pointer}
  .sim-ratebox{background:var(--accent-soft);border:1px solid var(--accent-soft-2);border-radius:8px;
    padding:6px 11px;min-width:78px;text-align:center}
  .sim-ratebox .v{font-size:16px;font-weight:800;color:var(--accent-deep);letter-spacing:-.02em}
  .sim-ratebox .l{font-size:8.5px;font-weight:800;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
  .sim-quick{display:flex;gap:6px;margin-top:11px}
  .qbtn{flex:1;border:1px solid var(--line-strong);border-radius:7px;padding:7px;font-size:11px;
    font-weight:700;color:var(--ink-2);background:var(--panel);transition:.12s}
  .qbtn:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
  .sim-result{margin-top:16px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;padding:16px 18px}
  .sim-result-grid{display:flex;gap:16px}
  .sim-rcell{flex:1}
  .sim-rcell+.sim-rcell{padding-left:16px;border-left:1px solid var(--line)}
  .sim-rcell .rl{font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .sim-rcell .rv{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-top:4px}
  .sim-rcell .rv .arrow{color:var(--ink-4);font-size:14px;margin:0 4px;font-weight:700}
  .sim-rcell .rv .now{color:var(--ink-3);font-size:14px;font-weight:700}
  .sim-gain{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line-strong);
    font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.6}
  .sim-gain b{color:var(--up);font-weight:800;font-size:15px}

  .viz-idle{background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--r-lg);
    padding:48px 30px;text-align:center;color:var(--ink-3)}
  .viz-idle .vi-icon{display:flex;justify-content:center;margin-bottom:13px;opacity:.4}
  .viz-idle .vi-title{font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
  .viz-idle .vi-sub{font-size:11.5px;line-height:1.6}

  /* ----- EMPTY ----- */
  .empty-main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
  .empty-box{text-align:center;max-width:480px}
  .empty-mark{width:66px;height:66px;border-radius:19px;margin:0 auto 22px;
    background:linear-gradient(150deg,var(--accent),var(--accent-2));display:flex;align-items:center;
    justify-content:center;box-shadow:0 16px 36px -10px rgba(15,122,100,.6)}
  .empty-box h2{font-size:25px;font-weight:800;letter-spacing:-.035em;margin-bottom:11px}
  .empty-box p{font-size:13.5px;color:var(--ink-2);line-height:1.78;margin-bottom:18px}
  .empty-steps{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
  .estep{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--line);border-radius:9px;padding:8px 13px}
  .estep b{color:var(--accent-deep)}
  .btn-primary{background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;
    padding:13px 26px;border-radius:11px;transition:.15s;display:inline-flex;
    align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(15,122,100,.6)}
  .btn-primary:hover{background:var(--accent-deep);transform:translateY(-1px)}

  /* ----- MODAL ----- */
  .overlay{position:fixed;inset:0;background:rgba(23,24,27,.42);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .modal{background:var(--panel);border-radius:18px;width:480px;max-width:100%;
    box-shadow:var(--shadow-pop);overflow:hidden;animation:pop .22s cubic-bezier(.2,.8,.2,1);
    max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line)}
  .modal-head{padding:22px 24px 4px;flex-shrink:0}
  .modal-head h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .modal-head p{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.6}
  .modal-body{padding:18px 24px 4px;overflow-y:auto}
  .field{margin-bottom:16px}
  .field label{font-size:11px;font-weight:800;color:var(--ink-2);display:block;margin-bottom:7px;
    letter-spacing:.04em;text-transform:uppercase}
  .field input[type=text],.field select{width:100%;border:1px solid var(--line-strong);
    border-radius:10px;padding:11px 12px;font-size:13.5px;font-weight:500;color:var(--ink);
    background:var(--panel);transition:.12s}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .preview{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
  .preview-label{font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:9px}
  .preview-steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .pv-step{font-size:11px;font-weight:700;background:var(--panel);border:1px solid var(--line-strong);
    border-radius:6px;padding:4px 9px;color:var(--ink-2)}
  .pv-arrow{color:var(--ink-4);font-size:9px}
  .check-row{display:flex;align-items:center;gap:9px;margin-top:12px;cursor:pointer}
  .check-row input{width:16px;height:16px;accent-color:var(--accent)}
  .check-row span{font-size:12px;color:var(--ink-2);font-weight:600}
  .modal-foot{padding:15px 24px 20px;display:flex;gap:10px;justify-content:flex-end;
    border-top:1px solid var(--line);flex-shrink:0}
  .btn-ghost{padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:.12s}
  .btn-ghost:hover{background:var(--bg)}
  .btn-solid{padding:10px 22px;border-radius:10px;font-size:12.5px;font-weight:700;
    background:var(--accent);color:#fff;transition:.15s}
  .btn-solid:hover{background:var(--accent-deep)}

  /* ----- HISTORY ----- */
  .spark-wrap{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px 11px;margin-bottom:16px}
  .spark-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .spark-label{font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .spark-cur{font-size:13px;font-weight:800;color:var(--accent)}
  .snap-list{display:flex;flex-direction:column;gap:7px}
  .snap-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .snap-date{font-size:12.5px;font-weight:700;color:var(--ink)}
  .snap-sub{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
  .snap-cvr{font-size:15px;font-weight:800;color:var(--ink);margin-left:auto}
  .snap-delta{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px}
  .snap-delta.up{background:var(--up-soft);color:var(--up)}
  .snap-delta.down{background:var(--danger-soft);color:var(--danger)}
  .snap-delta.flat{background:var(--bg-2);color:var(--ink-3)}
  .snap-act{display:flex;gap:3px}
  .snap-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;color:var(--ink-3);transition:.12s}
  .snap-btn:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .snap-btn.del:hover{background:var(--danger-soft);color:var(--danger)}
  .hist-empty{text-align:center;padding:36px 20px;color:var(--ink-3)}
  .hist-empty .he-ico{display:flex;justify-content:center;opacity:.4;margin-bottom:11px}
  .hist-empty .he-t{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
  .hist-empty .he-s{font-size:11.5px;line-height:1.6}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:12px 20px;
    border-radius:10px;z-index:80;transition:.3s;opacity:0;box-shadow:var(--shadow-pop);
    display:flex;align-items:center;gap:9px}
  .toast.show{transform:translateX(-50%);opacity:1}
  .toast svg{color:var(--accent-3)}

  /* ----- ENTRANCE ANIMATION (画面遷移時のみ) ----- */
  .reveal>*{opacity:0;animation:fadeup .5s cubic-bezier(.2,.7,.3,1) forwards}
  .reveal>*:nth-child(1){animation-delay:.02s}
  .reveal>*:nth-child(2){animation-delay:.08s}
  .reveal>*:nth-child(3){animation-delay:.14s}
  .ws-viz.reveal>*:nth-child(1){animation-delay:.1s}
  .ws-viz.reveal>*:nth-child(2){animation-delay:.16s}
  .ws-viz.reveal>*:nth-child(3){animation-delay:.22s}
  @keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* ============ DETAIL TAB（詳細データ） ============ */
  .period-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .period-label{font-size:10px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
  .period-tab{padding:6px 13px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink-2);
    background:var(--panel);border:1px solid var(--line-strong);transition:.13s;font-variant-numeric:tabular-nums}
  .period-tab:hover{border-color:var(--accent);color:var(--accent-deep)}
  .period-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 10px -4px rgba(15,122,100,.5)}
  .period-add{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--accent-deep);
    background:none;border:1px dashed var(--line-strong);transition:.13s;display:inline-flex;align-items:center;gap:4px}
  .period-add:hover{border-color:var(--accent);background:var(--accent-soft)}
  .period-add.is-disabled,.period-add[disabled]{opacity:.45;pointer-events:none;color:var(--ink-4);border-color:var(--line-2)}
  /* カレンダー用の動的 input。body 直下に置かれ、showPicker() で呼び出される。視認不可だがクリックは受ける */
  .period-date-hidden{position:fixed;left:50%;top:80px;transform:translateX(-50%);
    width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;z-index:1}

  .ws-tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .ws-tab{padding:11px 17px 12px;font-size:13px;font-weight:700;color:var(--ink-3);background:none;
    border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.14s;
    display:flex;align-items:center;gap:7px}
  .ws-tab:hover{color:var(--ink)}
  .ws-tab.active{color:var(--accent-deep);border-bottom-color:var(--accent)}
  .ws-tab svg{opacity:.7}
  .ws-tab.active svg{opacity:1}
  .ws-tab .tab-badge{font-size:10px;font-weight:800;background:var(--bg-2);color:var(--ink-3);
    padding:1px 7px;border-radius:20px}
  .ws-tab.active .tab-badge{background:var(--accent-soft);color:var(--accent-deep)}
  .tab-pane{display:none}
  .tab-pane.active{display:block}

  .detail-intro{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-2);
    line-height:1.65;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);
    padding:13px 15px;margin-bottom:18px;font-weight:500}
  .detail-intro svg{flex-shrink:0;margin-top:1px;color:var(--accent)}
  .detail-list{display:flex;flex-direction:column}

  .dtable{--dt-cols:24px minmax(86px,1.2fr) minmax(132px,1.5fr) 84px 58px minmax(0,1.45fr) 26px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
  .dt-head{display:grid;grid-template-columns:var(--dt-cols);gap:10px;padding:10px 16px;
    background:var(--panel-2);border-bottom:1px solid var(--line);font-size:9px;font-weight:800;
    color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .dt-head .r{text-align:right}
  .dt-row{border-bottom:1px solid var(--line-2)}
  .dt-row:last-child{border-bottom:none}
  .dt-main{display:grid;grid-template-columns:var(--dt-cols);gap:10px;align-items:center;
    padding:8px 16px;cursor:pointer;transition:background .12s}
  .dt-main:hover{background:var(--panel-2)}
  .dt-row.bn .dt-main{background:var(--danger-soft)}
  .dt-row.bn .dt-main:hover{background:var(--danger-soft)}
  .dt-num{width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent-deep);
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .dt-row.bn .dt-num{background:var(--danger);color:#fff}
  .dt-name-in{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;
    font-size:13px;font-weight:700;color:var(--ink);width:100%;letter-spacing:-.01em;transition:.12s}
  .dt-name-in:hover{background:var(--bg)}
  .dt-name-in:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .dt-countwrap{position:relative;display:flex;align-items:center;height:32px}
  .dt-bar{position:absolute;left:0;top:4px;bottom:4px;border-radius:6px;min-width:3px;
    background:linear-gradient(90deg,var(--accent-3),var(--accent));opacity:.24;pointer-events:none}
  .dt-row.bn .dt-bar{background:linear-gradient(90deg,var(--danger-2),var(--danger));opacity:.2}
  .dt-count-in{position:relative;z-index:1;border:1px solid transparent;background:transparent;border-radius:6px;
    padding:5px 9px;font-size:15px;font-weight:800;color:var(--ink);width:100%;text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:.12s}
  .dt-count-in:hover{background:rgba(255,255,255,.55);border-color:var(--line-strong)}
  .dt-count-in:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .dt-count-in::-webkit-outer-spin-button,.dt-count-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .dt-count-in::placeholder{color:var(--ink-4);font-weight:600}
  .dt-rate{text-align:right;font-size:14px;font-weight:800;color:var(--accent-deep);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
  .dt-rate .sub{display:block;font-size:8px;font-weight:800;color:var(--ink-4);letter-spacing:.02em;margin-top:1px}
  .dt-rate.bn{color:var(--danger)}
  .dt-rate.none{color:var(--ink-4)}
  .dt-rate.gain{color:var(--up)}
  .dt-reach{text-align:right;font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .dt-reach.dim{color:var(--ink-4)}
  .dt-sum{font-size:10.5px;color:var(--ink-2);font-weight:600;line-height:1.4;overflow:hidden;
    display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
  .dt-sum .none{color:var(--ink-4);font-weight:500}
  .dt-sum .warn{color:var(--amber);font-weight:800;background:#fbf2dd;border-radius:4px;padding:1px 6px}
  .dt-sum b{color:var(--ink);font-weight:800}
  .dt-toggle{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-3);transition:.15s;justify-self:end;background:none}
  .dt-toggle:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .dt-toggle svg{transition:transform .22s}
  .dt-row.open .dt-toggle svg{transform:rotate(180deg)}
  .dt-detail{display:none;padding:2px 16px 16px;background:var(--panel-2)}
  .dt-row.open .dt-detail{display:block}
  .dsec{padding-top:13px;margin-top:11px;border-top:1px dashed var(--line-strong)}
  .dsec:first-child{border-top:none;margin-top:0;padding-top:10px}
  .dsec-title{font-size:9.5px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;
    margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .dsec-title svg{opacity:.6}

  .dmetric{display:grid;grid-template-columns:minmax(0,1fr) 120px 86px 26px;gap:8px;align-items:center;margin-bottom:6px}
  .dm-in{border:1px solid var(--line-2);background:var(--panel-2);border-radius:7px;padding:7px 10px;
    font-size:12.5px;font-weight:600;color:var(--ink);transition:.12s;width:100%}
  .dm-in:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .dm-in::placeholder{color:var(--ink-4);font-weight:500}
  .dm-in.val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .dm-in.unit{text-align:center;color:var(--ink-2);font-weight:700}
  .dm-del{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-4);transition:.12s;font-size:11px}
  .dm-del:hover{background:var(--danger-soft);color:var(--danger)}

  .ddaily-grid{display:flex;flex-wrap:wrap;gap:7px}
  .ddaily-ro{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .ddaily-ro b{font-size:10.5px;font-weight:700;color:var(--ink-3)}
  .ddaily{display:flex;align-items:center;gap:4px;background:var(--panel-2);border:1px solid var(--line-2);
    border-radius:8px;padding:4px 5px 4px 9px}
  .ddaily:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .dd-date{border:none;background:transparent;font-size:11px;font-weight:700;color:var(--ink-2);width:50px;font-family:inherit}
  .dd-date:focus{outline:none;color:var(--accent-deep)}
  .dd-val{border:none;background:transparent;font-size:13px;font-weight:800;color:var(--ink);width:48px;
    text-align:right;font-variant-numeric:tabular-nums}
  .dd-val:focus{outline:none}
  .dd-val::-webkit-outer-spin-button,.dd-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .dd-del{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-4);font-size:10px;transition:.12s}
  .dd-del:hover{background:var(--danger-soft);color:var(--danger)}

  .dadd{font-size:11px;font-weight:700;color:var(--accent-deep);padding:6px 11px;border-radius:7px;background:none;
    border:1px dashed var(--line-strong);transition:.12s;display:inline-flex;align-items:center;gap:5px;margin-top:7px}
  .dadd:hover{border-color:var(--accent);background:var(--accent-soft)}

  .dmemo-in{width:100%;border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;
    padding:9px 11px;font-size:12.5px;font-weight:500;color:var(--ink);line-height:1.6;resize:vertical;
    min-height:44px;font-family:inherit}
  .dmemo-in:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .dmemo-in::placeholder{color:var(--ink-4)}

  /* 電話相談予約枠 */
  .phone-card{margin-top:20px;background:linear-gradient(135deg,var(--accent-soft),var(--panel) 72%);
    border:1px solid var(--accent-soft-2);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:19px 22px}
  .phone-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .phone-ico{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 5px 13px -5px rgba(15,122,100,.6)}
  .phone-title{font-size:13px;font-weight:800;color:var(--accent-deep);letter-spacing:.02em;text-transform:uppercase}
  .phone-desc{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-bottom:16px;font-weight:500}
  .phone-grid{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
  .phone-input-box{flex:0 0 auto}
  .phone-input-label{font-size:10px;font-weight:800;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  .phone-input-field{display:flex;align-items:center;gap:7px}
  .phone-in{width:118px;border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;
    padding:10px 12px;font-size:20px;font-weight:800;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .phone-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .phone-in::-webkit-outer-spin-button,.phone-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .phone-unit{font-size:12px;font-weight:700;color:var(--ink-3)}
  .phone-stats{flex:1;display:flex;gap:11px;min-width:230px}
  .phone-stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    display:flex;flex-direction:column;justify-content:center}
  .phone-stat .ps-v{font-size:21px;font-weight:800;color:var(--accent-deep);letter-spacing:-.02em}
  .phone-stat .ps-v.dim{color:var(--ink-4)}
  .phone-stat .ps-l{font-size:10px;font-weight:700;color:var(--ink-3);line-height:1.45;margin-top:4px}
  .phone-stat .ps-l b{color:var(--ink-2);font-weight:800}
  .phone-note-in{width:100%;margin-top:13px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;
    padding:9px 11px;font-size:12px;font-weight:500;color:var(--ink);resize:vertical;min-height:38px;font-family:inherit}
  .phone-note-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .phone-note-in::placeholder{color:var(--ink-4)}

  /* マトリクス入力欄の共通スタイル（renderEditor が使う） */
  .mx-total-in,.mx-in{width:100%;border:none;background:transparent;padding:9px 9px;font-size:13px;font-weight:700;
    color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-family:inherit;min-width:52px}
  .mx-total-in{font-weight:800;color:var(--accent-deep)}
  .mx-in::placeholder{color:var(--ink-4)}
  .mx-in:focus,.mx-total-in:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff;border-radius:3px}
  .mx-in::-webkit-outer-spin-button,.mx-in::-webkit-inner-spin-button,.mx-total-in::-webkit-outer-spin-button,.mx-total-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* 日別比較タブ */
  .cmp-intro{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:var(--ink-2);line-height:1.6;
    font-weight:500;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;margin-bottom:16px}
  .cmp-intro svg{flex-shrink:0;margin-top:1px;color:var(--accent)}
  .cmp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
  .cmp-title{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
  .cmp-note{font-size:12px;color:var(--ink-2);margin-top:14px;font-weight:600;padding-top:13px;border-top:1px solid var(--line-2)}
  .cmp-note .up{color:var(--up);font-weight:800}
  .cmp-note .down{color:var(--danger);font-weight:800}
  .cmp-table-wrap{overflow-x:auto}
  .cmp-table{border-collapse:separate;border-spacing:0;width:100%;min-width:420px}
  .cmp-table thead th{font-size:10px;font-weight:800;color:var(--ink-3);padding:8px 10px;text-align:right;
    text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap}
  .cmp-table thead th.cmp-rowlabel{text-align:left}
  .cmp-rowlabel{font-size:12px;font-weight:700;color:var(--ink);text-align:left;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line-2)}
  .cmp-cell{font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:right;padding:9px 10px;
    font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line-2)}
  .cmp-cell.cmp-best{background:var(--up-soft);color:var(--up);font-weight:800}
  .cmp-cell.cmp-worst{background:var(--danger-soft);color:var(--danger);font-weight:800}
  .cmp-cell.cmp-total{font-weight:800;color:var(--accent-deep);background:var(--panel-2)}
  .cmp-empty{text-align:center;padding:54px 24px;color:var(--ink-3)}
  .cmp-empty-t{font-size:14.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
  .cmp-empty-s{font-size:12px;line-height:1.7}

  /* 日別比較タブの大テーブル：段階の通過人数（濃い行）と遷移率（薄い行）を交互配置 */
  .cmp-bigtable .cmp-stage-row td{background:#f0f4f3;border-bottom:1px solid #d8e5e1;padding:11px 12px}
  .cmp-bigtable .cmp-stage-row td.cmp-best{background:#dff1e2}
  .cmp-bigtable .cmp-stage-row td.cmp-worst{background:#fbe2dd}
  .cmp-bigtable .cmp-stage-row td.cmp-total{background:var(--accent-soft)}
  .cmp-bigtable .cmp-stage-row .cmp-numcell{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .cmp-bigtable .cmp-stage-row td.cmp-rowlabel{font-size:12.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;min-height:36px}
  .cmp-stagenum{display:inline-flex;width:22px;height:22px;border-radius:7px;background:var(--accent);
    color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;flex-shrink:0}
  .cmp-bigtable .cmp-trans-row td{padding:8px 12px;background:var(--panel);border-bottom:1px dashed #e2e6e4}
  .cmp-bigtable .cmp-trans-row td.cmp-best{background:var(--up-soft)}
  .cmp-bigtable .cmp-trans-row td.cmp-worst{background:var(--danger-soft)}
  .cmp-bigtable .cmp-trans-row td.cmp-total{background:var(--panel-2)}
  .cmp-bigtable .cmp-trans-row .cmp-ratecell{font-size:13px;font-weight:800;color:var(--accent-deep);font-variant-numeric:tabular-nums;line-height:1.2}
  .cmp-bigtable .cmp-trans-row .cmp-ratecell.cmp-best{color:var(--up)}
  .cmp-bigtable .cmp-trans-row .cmp-ratecell.cmp-worst{color:var(--danger)}
  .cmp-bigtable .cmp-trans-row td.cmp-rowlabel{font-size:11px;font-weight:600;color:var(--ink-2);padding-left:30px}
  .cmp-transarrow{color:var(--ink-3);font-weight:800;margin-right:6px}
  .cmp-sub{display:block;font-size:9.5px;font-weight:700;color:var(--ink-4);margin-top:2px;letter-spacing:0}
  .cmp-sub.up{color:var(--up)}
  .cmp-dim{color:var(--ink-4);font-weight:500}

  @media(max-width:620px){
    .dmetric{grid-template-columns:minmax(0,1fr) 92px 26px}
    .dm-in.unit{display:none}
    .dcard-headnums{gap:11px}
    .dcard-rate{min-width:60px}
    .phone-stats{min-width:100%}
  }

  /* ----- RESPONSIVE ----- */
  @media(max-width:1180px){
    .kpibar{grid-template-columns:1fr 1fr 1.1fr 1.7fr}
    .kpibar.has-rev{grid-template-columns:1fr 1fr 1fr 1.1fr 1.7fr}
  }
  @media(max-width:1040px){
    .kpibar{grid-template-columns:1fr 1fr}
    .kpibar.has-rev{grid-template-columns:1fr 1fr}
    .kpi{border-bottom:1px solid var(--line)}
    .kpi.cvr{order:-1;grid-column:1/-1}
    .kpi.bn{grid-column:1/-1;border-right:none}
    .kpi:nth-child(2){border-right:none}
  }
  @media(max-width:880px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);
      transition:transform .25s ease;box-shadow:var(--shadow-pop)}
    .sidebar.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
    .scrim.show{display:block}
    .tb-burger{display:flex}
    .topbar{padding:0 16px}
    .canvas{padding:18px 16px 60px}
    .tb-btn span.lbl{display:none}
    .fcell-label{width:160px;padding-right:14px}
    .fc-caption{max-width:100%}
  }
  @media(max-width:560px){
    .kpibar{grid-template-columns:1fr}
    .kpibar.has-rev{grid-template-columns:1fr}
    .kpi{border-right:none}
    .fcell-label{width:128px}
    .fstep-count{font-size:18px}.fconn-rate{font-size:16px}
    .sim-result-grid{flex-direction:column;gap:12px}
    .sim-rcell+.sim-rcell{padding-left:0;border-left:none;padding-top:12px;border-top:1px solid var(--line)}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .reveal>*{opacity:1}
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 5h18l-7 8v6l-4 2v-8L3 5z" fill="#fff"/></svg>
      </div>
      <div>
        <div class="brand-name">ファネルスコープ</div>
        <div class="brand-sub">導線ボトルネック分析</div>
      </div>
    </div>
    <div class="side-head">
      <span>導線リスト</span>
      <button class="btn-add" id="addFunnelBtn" title="新しい導線を作成" aria-label="新しい導線を作成">+</button>
    </div>
    <div class="funnel-list" id="funnelList"></div>
    <div class="side-foot">
      <div class="side-foot-row">
        <button class="foot-btn" id="exportBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>バックアップ
        </button>
        <button class="foot-btn" id="importBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>復元
        </button>
      </div>
      <div class="side-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>データはこのブラウザ内だけに保存され、外部には送信されません。</span>
      </div>
      <div class="side-ver">v2.0 — Local Edition</div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <main class="main" id="main"></main>
</div>

<!-- CREATE MODAL -->
<div class="overlay" id="overlayCreate">
  <div class="modal" role="dialog" aria-modal="true" aria-label="新しい導線を作成">
    <div class="modal-head">
      <h3>新しい導線を作成</h3>
      <p>セールス・広告・SNSなどの導線を登録します。種類を選ぶと入力欄が自動で組み上がります。</p>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="mName">導線の名前</label>
        <input type="text" id="mName" placeholder="例：5月 Instagram広告キャンペーン">
      </div>
      <div class="field">
        <label for="mType">導線の種類</label>
        <select id="mType">
          <option value="広告">広告（リスティング・SNS広告など）</option>
          <option value="SNS">SNS（投稿・プロフィール導線）</option>
          <option value="セールス">セールス（リスト〜成約）</option>
          <option value="メルマガ・LINE">メルマガ・LINE配信</option>
          <option value="その他">その他・自由作成</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:8px">
        <div class="preview">
          <div class="preview-label">自動生成されるステップ</div>
          <div class="preview-steps" id="mPreview"></div>
        </div>
        <label class="check-row">
          <input type="checkbox" id="mBlank">
          <span>テンプレートを使わず、空のステップから始める</span>
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="mCancel">キャンセル</button>
      <button class="btn-solid" id="mCreate">作成する</button>
    </div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="overlay" id="overlayHistory">
  <div class="modal" role="dialog" aria-modal="true" aria-label="記録の履歴">
    <div class="modal-head">
      <h3>記録の履歴</h3>
      <p>「記録する」で保存した時点の数値です。全体コンバージョン率の推移と、各時点の差分を確認できます。</p>
    </div>
    <div class="modal-body" id="historyBody"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="hClose">閉じる</button>
      <button class="btn-solid" id="hSnap">現在の数値を記録</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= DATA ================= */
const TEMPLATES = {
  "広告":         ["広告 表示（インプレッション）","広告 クリック","LP 訪問","LINE / メルマガ登録","商品 購入"],
  "SNS":          ["投稿 リーチ","プロフィール 訪問","リンク クリック","LP 訪問","登録 / 申込"],
  "セールス":      ["リスト / リード","アポ獲得","商談 実施","提案 / 見積","成約"],
  "メルマガ・LINE": ["配信数","開封","リンク クリック","LP 訪問","購入 / 申込"],
  "その他":        ["ステップ 1","ステップ 2","ステップ 3"]
};
const STORE_KEY = "funnelscope_local_v2";

const uid  = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function dateStamp(){const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;}
function shortDate(iso){const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()}`;}
function fullDate(iso){const d=new Date(iso);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}

/* ===== 詳細データの正規化ヘルパー（補助指標・日別内訳・メモ・電話予約） ===== */
function normMetrics(arr){ return (arr||[]).map(m=>({id:m.id||uid("m"),label:m.label||"",value:m.value??"",unit:m.unit||""})); }
function normDaily(arr){ return (arr||[]).map(d=>({id:d.id||uid("d"),date:d.date||"",value:d.value??""})); }
function normPhone(p){ return {count:(p&&p.count!=null)?p.count:"",note:(p&&p.note)||""}; }
/* ===== 日別カウント関連（period="total"=合計／日付ラベル=その日） ===== */
function normCounts(obj){ const o={}; if(obj&&typeof obj==='object') for(const k in obj){ const v=obj[k]; if(v!==''&&v!=null&&!isNaN(Number(v))) o[k]=Math.max(0,Number(v)); } return o; }
function hasDaily(s){ return !!s.counts && Object.keys(s.counts).some(k=>s.counts[k]!==''&&s.counts[k]!=null); }
function stepTotal(s){ return hasDaily(s) ? Object.keys(s.counts).reduce((a,k)=>a+num(s.counts[k]),0) : num(s.total); }
function stepCount(s,period){ period=period||activePeriod; return period==="total" ? stepTotal(s) : num(s.counts&&s.counts[period]); }
/* 合計モードで日別が入っている段階は自動集計のため直接編集不可 */
function stepCountEditable(s,period){ period=period||activePeriod; return !(period==="total" && hasDaily(s)); }
/* 入力欄に出す値（未入力は空文字、合計×日別ありは自動集計値） */
function stepCountInputValue(s,period){
  period=period||activePeriod;
  if(period==="total"){ if(hasDaily(s)) return stepTotal(s); return (s.total===''||s.total==null)?'':s.total; }
  const v=s.counts&&s.counts[period]; return (v===''||v==null)?'':v;
}
/* 入力欄からの保存（合計→total、特定日→counts[date]。空は削除） */
function setStepCount(s,period,raw){
  period=period||activePeriod;
  const v = raw===""?"":Math.max(0,Number(raw)||0);
  if(period==="total"){ if(hasDaily(s)) return; s.total=v; }
  else { s.counts=s.counts||{}; if(v==="") delete s.counts[period]; else s.counts[period]=v; }
}
function collectDates(steps){ const seen=[]; (steps||[]).forEach(s=>Object.keys(s.counts||{}).forEach(d=>{ if(!seen.includes(d)) seen.push(d); })); return seen; }
/* 旧形式（count 単一値 / daily[]）も新形式（counts{} / total）も受け取り、新形式へ正規化する */
function normStep(s,keepId){
  let counts={};
  if(Array.isArray(s.daily)) s.daily.forEach(d=>{ if(d&&d.date) counts[d.date]=Math.max(0,Number(d.value)||0); });  /* 旧 daily[] → counts */
  if(s.counts) Object.assign(counts, normCounts(s.counts));
  let total = (s.total!==undefined&&s.total!=='')?s.total : (s.count??'');                                          /* 旧 count → total */
  return {id:(keepId&&s.id)||uid("s"),name:s.name||"",counts,
    total:(total===''||total==null)?'':Math.max(0,Number(total)||0),
    metrics:normMetrics(s.metrics),memo:s.memo||""};
}

/* ================= METRICS (純粋関数・仕様書4.6) ================= */
function computeMetrics(funnel,period){
  period=period||activePeriod;
  const steps=funnel.steps.map((s,i)=>{
    const count=stepCount(s,period);
    let rate=null,lost=null;
    if(i>0){
      const prev=stepCount(funnel.steps[i-1],period);
      if(prev>0){ rate=count/prev*100; lost=prev-count; }
    }
    return {id:s.id,name:s.name,count,rate,lost,index:i};
  });
  let bottleneck=-1,minRate=Infinity,hasRate=false,bigDrop=-1,maxLost=-1;
  steps.forEach(s=>{
    if(s.rate!==null){
      hasRate=true;
      if(s.rate<minRate){minRate=s.rate;bottleneck=s.index;}
      if(s.lost>maxLost){maxLost=s.lost;bigDrop=s.index;}
    }
  });
  const first=steps.length?steps[0].count:0;
  const last =steps.length?steps[steps.length-1].count:0;
  const overall=first>0?last/first*100:null;
  const maxCount=Math.max(1,...steps.map(s=>s.count));
  const unitValue=num(funnel.unitValue);
  const revenue=unitValue>0?last*unitValue:null;   /* 想定売上＝最終到達人数×客単価（客単価未入力なら null） */
  return {steps,bottleneck,bigDrop,maxLost,hasRate,first,last,overall,maxCount,unitValue,revenue,period};
}
/* what-if simulation: 指定1箇所の遷移率のみ改善・下流の遷移率は現状維持（仕様書4.6.6） */
function simulate(funnel,idx,newRatePct,period){
  period=period||activePeriod;
  const m=computeMetrics(funnel,period);
  const base=m.steps.map(s=>s.count);
  const sim=base.slice();
  if(idx<1||idx>=base.length) return {sim:base,newFinal:m.last,origFinal:m.last,gain:0,newCVR:m.overall,origCVR:m.overall,origRevenue:m.revenue,newRevenue:m.revenue,revenueGain:0};
  sim[idx]=base[idx-1]*(newRatePct/100);
  for(let j=idx+1;j<sim.length;j++){
    const r=base[j-1]>0?base[j]/base[j-1]:0;
    sim[j]=sim[j-1]*r;
  }
  const newFinal=sim[sim.length-1], origFinal=base[base.length-1];
  const newCVR=base[0]>0?newFinal/base[0]*100:null;
  const uv=m.unitValue;
  const origRevenue=uv>0?origFinal*uv:null, newRevenue=uv>0?newFinal*uv:null;
  const revenueGain=(origRevenue!==null)?newRevenue-origRevenue:null;
  return {sim,newFinal,origFinal,gain:newFinal-origFinal,newCVR,origCVR:m.overall,origRevenue,newRevenue,revenueGain};
}
function snapCVR(snap){
  if(!snap.steps.length) return null;
  const f=num(snap.steps[0].count), l=num(snap.steps[snap.steps.length-1].count);
  return f>0?l/f*100:null;
}

                <div class="ed-hint">段階名と日付ごとの通過人数を入力すると、合計と下のファネル図・遷移率に自動反映されます。日付列の追加は表右の「＋」ボタン、または上の期間バーから。Excelで範囲をコピーしてセルに貼り付け（Ctrl+V）、Enter／矢印キーで上下移動できます。並べ替えは行頭をドラッグするか、右端の ▲▼ から。</div>
                <div class="ed-money">
                  <label class="ed-money-label" for="unitValueIn">成果1件あたりの売上（客単価）</label>
                  <div class="ed-money-field">
                    <span class="ed-money-yen">¥</span>
                    <input class="ed-money-in num" id="unitValueIn" type="number" min="0" inputmode="numeric" placeholder="例：12,000" value="${f.unitValue===''||f.unitValue==null?'':f.unitValue}">
                    <span class="ed-money-unit">／件</span>
                  </div>
                  <div class="ed-money-hint">最終ステップ（購入・成約など）に到達した1人あたりの売上です。入力すると、上の統計と改善シミュレーターに金額が表示されます。空欄なら人数だけの表示に戻ります。</div>
                </div>
              </div>
            </div>
            <div class="ws-viz reveal" id="vizArea"></div>
          </div>
        </div>
        <div class="tab-pane" id="paneDetail"></div>
        <div class="tab-pane" id="paneCompare"></div>
      </div>
    </div>`;

  const nameIn=document.getElementById("tbName");
  nameIn.oninput=()=>{ f.name=nameIn.value; saveSoon(); renderSidebar(); };
  document.getElementById("addStep").onclick=()=>{
    f.steps.push(normStep({name:""}));
    saveSoon(); renderEditor(); renderViz(); renderKPI(); renderSidebar();
    const ins=document.querySelectorAll(".step-name-in");
    if(ins.length) ins[ins.length-1].focus();
  };
  const uvIn=document.getElementById("unitValueIn");
  if(uvIn) uvIn.oninput=()=>{
    f.unitValue = uvIn.value===""?"":Math.max(0,Number(uvIn.value));
    saveSoon(); renderKPI(); updateSim();   /* 客単価欄は左カラム＝再描画しないのでフォーカス保持 */
  };
  document.getElementById("snapBtn").onclick=takeSnapshot;
  document.getElementById("histBtn").onclick=openHistory;
  document.getElementById("burger").onclick=openSidebar;
  const menu=document.getElementById("funnelMenu");
  document.getElementById("menuBtn").onclick=e=>{ e.stopPropagation(); menu.classList.toggle("show"); };
  document.getElementById("dupItem").onclick=()=>{ menu.classList.remove("show"); duplicateFunnel(); };
  document.getElementById("delItem").onclick=()=>{ menu.classList.remove("show"); deleteFunnel(); };
  document.getElementById("tabBtnFunnel").onclick=()=>setTab("funnel");
  document.getElementById("tabBtnDetail").onclick=()=>setTab("detail");
  document.getElementById("tabBtnCompare").onclick=()=>setTab("compare");

  renderPeriodBar();
  renderKPI();
  renderEditor();
  renderViz();
  applyTabState();   /* activeTab に応じて表示するタブを適用（detail なら詳細ビューを描画） */

  /* 画面遷移時のみの登場アニメ（入力中の部分更新では再生されない） */
  const vr=document.getElementById("vizArea");
  vr.addEventListener("animationend",()=>vr.classList.remove("reveal"),{once:true});
  const kb=document.getElementById("kpibar");
  kb.addEventListener("animationend",()=>kb.classList.remove("reveal"),{once:true});
}

/* ================= TABS（ファネル図／詳細データの切替） ================= */
function applyTabState(){
  const pf=document.getElementById("paneFunnel"), pd=document.getElementById("paneDetail"), pcmp=document.getElementById("paneCompare");
  const bf=document.getElementById("tabBtnFunnel"), bd=document.getElementById("tabBtnDetail"), bcmp=document.getElementById("tabBtnCompare");
  if(!pf||!pd) return;
  pf.classList.toggle("active", activeTab==="funnel");
  pd.classList.toggle("active", activeTab==="detail");
  if(pcmp) pcmp.classList.toggle("active", activeTab==="compare");
  bf.classList.toggle("active", activeTab==="funnel");
  bd.classList.toggle("active", activeTab==="detail");
  if(bcmp) bcmp.classList.toggle("active", activeTab==="compare");
  if(activeTab==="detail") renderDetail();
  else if(activeTab==="compare") renderCompare();
}
function setTab(tab){
  activeTab=tab;
  applyTabState();
  if(tab==="funnel"){ renderKPI(); renderEditor(); renderViz(); }   /* 詳細タブでの編集をファネル図側へ反映 */
}

/* ================= 期間セレクタ（合計／日別の切替） ================= */
function renderPeriodBar(){
  const f=activeFunnel(); const bar=document.getElementById("periodBar");
  if(!f||!bar) return;
  const dates=f.dates||[];
  /* 選択中の期間が削除済みなら合計に戻す */
  if(activePeriod!=="total" && !dates.includes(activePeriod)) activePeriod="total";
  let html=`<span class="period-label">期間</span>
    <button class="period-tab ${activePeriod==='total'?'active':''}" data-period="total">合計</button>`;
  dates.forEach(d=>{ html+=`<button class="period-tab ${activePeriod===d?'active':''}" data-period="${esc(d)}">${esc(d)}</button>`; });
  html+=`<button class="period-add" id="periodAdd" type="button">＋ 日を追加</button>`;
  if(dates.length){
    const delDisabled = activePeriod==="total";
    html+=`<button class="period-add" id="periodManage" type="button" ${delDisabled?'disabled title="上で削除したい日付タブを選んでください"':'title="現在選択中の日付を削除"'}>選択中の日付を削除</button>`;
  }
  bar.innerHTML=html;
  bar.querySelectorAll(".period-tab").forEach(b=>b.onclick=()=>setPeriod(b.dataset.period));
  const add=document.getElementById("periodAdd"); if(add) add.onclick=addDate;
  const mng=document.getElementById("periodManage"); if(mng) mng.onclick=manageDates;
}
function setPeriod(p){
  activePeriod=p;
  renderPeriodBar(); renderKPI(); renderEditor(); renderViz();
  if(activeTab==="detail") renderDetail(); else if(activeTab==="compare") renderCompare();
}
/* 「＋ 日を追加」ボタン：body 直下に動的に作った input[type=date] の showPicker() を呼ぶ。
   button + input オーバーレイ方式は Chrome で機能しなかったため、JS から明示的に開く。 */
function addDate(){
  let dateIn=document.getElementById("periodAddDate");
  if(!dateIn){
    dateIn=document.createElement('input');
    dateIn.type='date';
    dateIn.id='periodAddDate';
    dateIn.className='period-date-hidden';
    dateIn.setAttribute('aria-label','追加する日付を選択');
    dateIn.setAttribute('tabindex','-1');
    document.body.appendChild(dateIn);
    dateIn.addEventListener('change',()=>{
      if(!dateIn.value) return;
      const p=dateIn.value.split('-');
      addDateLabel(`${Number(p[1])}/${Number(p[2])}`);
      dateIn.value='';
    });
  }
  /* 初期値に今日を入れる（ピッカーの初期表示月が現実的になる） */
  if(!dateIn.value){
    const now=new Date();
    dateIn.value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  }
  /* showPicker → click → prompt の順でフォールバック */
  if(typeof dateIn.showPicker==='function'){
    try{ dateIn.showPicker(); return; }catch(err){ console.warn('showPicker failed:',err); }
  }
  try{ dateIn.click(); return; }catch(err){ console.warn('input.click failed:',err); }
  const label=prompt("追加する日付の見出しを入力してください（例：11/2）");
  if(label==null) return;
  addDateLabel(label);
}
/* 日付ラベル（"M/D"）を funnel.dates に追加し、関連UIを再描画する共通処理 */
function addDateLabel(label){
  const f=activeFunnel(); if(!f) return;
  const d=String(label).trim(); if(!d) return;
  f.dates=f.dates||[];
  if(!f.dates.includes(d)) f.dates.push(d);
  activePeriod=d; saveSoon();
  renderPeriodBar(); renderKPI(); renderEditor(); renderViz();
  if(activeTab==="detail") renderDetail(); else if(activeTab==="compare") renderCompare();
}
/* 現在選択中の日付タブを削除する（合計選択時はガイドのみ） */
function manageDates(){
  const f=activeFunnel(); if(!f||!(f.dates||[]).length) return;
  if(activePeriod==="total"){
    toast("削除したい日付タブを上で選んでから「選択中の日付を削除」を押してください");
    return;
  }
  const t=activePeriod;
  if(!f.dates.includes(t)) return;
  if(!confirm(`「${t}」を削除しますか？\nこの日にひもづく各段階の数値もすべて消えます。`)) return;
  f.dates=f.dates.filter(x=>x!==t);
  f.steps.forEach(s=>{ if(s.counts) delete s.counts[t]; });
  activePeriod="total";
  saveSoon(); renderPeriodBar(); renderKPI(); renderEditor(); renderViz();
  if(activeTab==="detail") renderDetail(); else if(activeTab==="compare") renderCompare();
}

/* ================= DETAIL（詳細データ：段階別カード） ================= */
function renderDetail(){
  const f=activeFunnel();
  const pane=document.getElementById("paneDetail");
  if(!f||!pane) return;
  /* 古いデータ／サンプル由来でも動くよう防御的に初期化 */
  f.phone=f.phone||{count:"",note:""};
  f.steps.forEach(s=>{ s.metrics=s.metrics||[]; if(s.memo==null)s.memo=""; s.counts=s.counts||{}; });
  f.dates=f.dates||[];
  const m=computeMetrics(f);

  pane.innerHTML = summaryBodyHTML(f,m) + phoneCardHTML(f);
  bindDetailEvents(f);
}

      rateHtml=`<div class="dt-rate ${isBn?'bn':(gain?'gain':'')}">${pct(ms.rate)}<span class="sub">${sub}</span></div>`;
    }

    const filled=s.metrics.filter(mt=> mt.label || mt.value!=="");

      </div>`).join("");
    const dates=f.dates||[];
    const dailyHtml = dates.map(d=>{ const v=s.counts&&s.counts[d]; return `<span class="ddaily-ro"><b>${esc(d)}</b>${v===''||v==null?'–':fmt(v)}</span>`; }).join("");

    html+=`<div class="dt-row ${isBn?'bn':''} ${open?'open':''}" data-sid="${s.id}">
      <div class="dt-main">
        <div class="dt-num">${i+1}</div>
        <input class="dt-name-in" data-k="name" value="${esc(s.name)}" placeholder="段階名">
        <div class="dt-countwrap">
          <div class="dt-bar" style="width:${barW.toFixed(1)}%"></div>
          <input class="dt-count-in" data-k="count" type="number" min="0" value="${stepCountInputValue(s)}" placeholder="0" ${stepCountEditable(s)?'':'readonly'} aria-label="通過人数">
        </div>
        ${rateHtml}
        ${reachHtml}
        <div class="dt-sum">${sum}${warn}</div>
        <button class="dt-toggle" title="詳細を開閉" aria-label="詳細を開閉"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div class="dt-detail">
        <div class="dsec">
          <div class="dsec-title"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4a1.2 1.2 0 0 1 1.2-1.2h8a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.6" fill="currentColor"/></svg>補助指標（クリック率・コストなど）</div>
          ${metricsHtml}

        </div>
        <div class="dsec">
          <div class="dsec-title"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>日別の内訳<span style="font-weight:600;color:var(--ink-4);text-transform:none;letter-spacing:0;margin-left:6px">（入力は「日別入力」タブ）</span></div>
          <div class="ddaily-grid">${dailyHtml||'<span style="font-size:11px;color:var(--ink-4);font-weight:600">日別データはまだありません</span>'}</div>
        </div>
        <div class="dsec">
          <div class="dsec-title"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M3 20l1-4 11-11 3 3L7 19l-4 1Z"/></svg>メモ</div>
          <textarea class="dmemo-in" data-k="memo" placeholder="この段階に関する補足・気づき・要確認事項など">${esc(s.memo)}</textarea>
        </div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}
